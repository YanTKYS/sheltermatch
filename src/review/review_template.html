<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>避難所候補レビュー（sheltermatch）</title>
<link rel="stylesheet" href="assets/css/leaflet.css">
<style>
  :root {
    --border: #d7dbe0;
    --muted: #5b6672;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --accent: #1b4d89;
    --warn-bg: #fff4e5;
    --warn-border: #e0a561;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    color: #1d2329; background: var(--bg); font-size: 14px;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0 0 4px; }
  .notice { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .notice strong { color: #8a4b08; }
  #main { display: flex; flex: 1; min-height: 0; }
  #sidebar {
    width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; overflow-y: auto;
  }
  #sidebar .section { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  #sidebar .section.grow { flex: 1; min-height: 160px; overflow-y: auto; }
  h2 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  input[type="search"] { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }
  .count { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .filters { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 6px; font-size: 12px; }
  .filters label { display: flex; align-items: center; gap: 3px; cursor: pointer; }
  .filters .filter-count { color: var(--muted); }
  ul.results { list-style: none; margin: 0; padding: 0; }
  ul.results li {
    padding: 6px 8px; border-radius: 4px; cursor: pointer; border: 1px solid transparent;
    line-height: 1.4;
  }
  ul.results li:hover { background: #eef2f7; }
  ul.results li.selected { background: #e3edf9; border-color: var(--accent); }
  .rid { font-weight: 600; }
  .addr { font-size: 12px; color: var(--muted); word-break: break-all; }
  .badge {
    display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px;
    border: 1px solid var(--warn-border); background: var(--warn-bg); color: #8a4b08; margin-left: 4px;
  }
  .nav { display: flex; gap: 6px; align-items: center; }
  button {
    padding: 5px 10px; border: 1px solid var(--border); background: #fff; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  button:hover:enabled { background: #eef2f7; }
  button:disabled { opacity: .45; cursor: default; }
  #content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #map { flex: 1; min-height: 240px; background: #f0f3f6; }
  .map-note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .map-note.warn { color: #8a4b08; }
  #map-fallback { padding: 16px; color: var(--muted); display: none; }
  #map-attribution {
    font-size: 11px; color: var(--muted); background: var(--panel);
    padding: 3px 10px; border-top: 1px solid var(--border);
  }
  /* 候補詳細は、上段（要支援者の概要と「候補詳細をたたむ」ボタン。スクロールしない）と、下段（経路情報・
     候補表。この部分だけスクロール）に分ける。候補表を下までスクロールしてもボタンが隠れないようにするため */
  #detail {
    border-top: 1px solid var(--border); background: var(--panel); max-height: 42%;
    display: flex; flex-direction: column; min-height: 0;
  }
  #detail-body { overflow-y: auto; min-height: 0; padding: 0 12px 10px; }
  /* 要支援者の概要と「候補詳細をたたむ」ボタンは同じ行に置き、ボタンのための行を増やさない */
  .detail-head { display: flex; align-items: flex-start; gap: 10px; flex: none; padding: 10px 12px 0; }
  .detail-head #selected-summary { flex: 1; min-width: 0; }
  #detail-toggle { flex: none; font-size: 12px; padding: 3px 8px; }
  #detail.collapsed #detail-body { display: none; }
  #detail.collapsed .detail-head { padding-bottom: 8px; }
  #detail.collapsed #selected-summary { margin-bottom: 0; }
  .status-warn { color: #8a4b08; font-weight: 600; }
  #selected-summary { margin-bottom: 8px; line-height: 1.6; }
  #selected-summary .title { font-size: 15px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid var(--border); padding: 5px 7px; text-align: left; vertical-align: top; }
  th { background: #eef1f5; font-weight: 600; }
  /* ハザード区分は大分類ごとにまとめて、横へ流す */
  .hazard-group { display: inline-block; margin-right: 10px; }
  /* 順位・距離は折り返さず最小幅にし、避難所名へ幅を回す */
  #candidates th:nth-child(1), #candidates td:nth-child(1),
  #candidates th:nth-child(3), #candidates td:nth-child(3) { white-space: nowrap; width: 1%; }
  #candidates td:nth-child(3) { text-align: right; }
  /* キーボードで候補行を選んでいるとき、どの行にいるかが分かるようにする（選択中の表示とは別の色） */
  #candidates tbody tr:focus-visible { outline: 3px solid #d97706; outline-offset: -3px; }
  .overview-control button {
    border: none; border-radius: 4px; padding: 5px 8px; font-size: 12px; background: #fff;
  }
  #candidates th:nth-child(2), #candidates td:nth-child(2) { min-width: 8em; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f2f6fb; }
  /* 選択中の候補は、背景色に加えて左端の太線・太字・「選択中」の文字でも示す（色だけに頼らない） */
  tbody tr.active { background: #e3edf9; }
  tbody tr.active td:first-child { box-shadow: inset 4px 0 0 var(--accent); font-weight: 700; }
  .selected-label {
    display: inline-block; margin-left: 4px; padding: 0 4px; font-size: 11px; font-weight: 700;
    border: 1px solid var(--accent); border-radius: 3px; color: var(--accent); background: #fff;
  }
  .rank-chip {
    display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center;
    border-radius: 50%; color: #fff; font-weight: 700; font-size: 12px;
  }
  .layers { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .layers label { display: flex; align-items: center; gap: 5px; font-size: 13px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; border: 1px solid rgba(0,0,0,.25); }
  .empty { color: var(--muted); padding: 8px 0; }
  .hazard-yes { color: #a13a0c; font-weight: 600; }
  .hazard-no { color: var(--muted); }
  .marker-pin {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.4); color: #fff; font-weight: 700; font-size: 12px;
    line-height: 18px; text-align: center;
  }
  /* 選択中の候補のマーカーは、ほかの候補より大きくし、黒い外枠を付ける（色以外でも区別できるように） */
  .marker-pin.selected {
    width: 30px; height: 30px; line-height: 26px; font-size: 15px;
    box-shadow: 0 0 0 3px #111, 0 1px 4px rgba(0,0,0,.5);
  }
  .leaflet-tooltip.selected-candidate-label { font-weight: 700; border: 2px solid #111; }
  /* ハザード別の人数集計（画面上部）。数字は大きく、ラベルは小さく。 */
  #summary { padding: 6px 14px 8px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .summary-head { display: flex; align-items: center; gap: 10px; }
  .summary-head h2 { margin: 0; flex: 1; }
  #summary-toggle { font-size: 12px; padding: 2px 8px; }
  #summary.collapsed .summary-body { display: none; }
  .summary-rows { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 4px; }
  .summary-group { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: flex-end; }
  .summary-group + .summary-group { padding-left: 22px; border-left: 1px solid var(--border); }
  .summary-item { display: flex; flex-direction: column; min-width: 4.5em; }
  .summary-item .label { font-size: 11px; color: var(--muted); }
  .summary-item .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .summary-item .swatch { margin-right: 4px; vertical-align: baseline; }
  .summary-group-title { flex-basis: 100%; font-size: 11px; color: var(--muted); }
  .summary-note { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>避難所候補レビュー（sheltermatch）</h1>
    <div class="notice">
      避難所候補は<strong>本人の地点からの直線距離による候補であり、最終的な割り当てではありません</strong>。
      地図の線は<strong>本人と避難所を結ぶ直線で、実際に通る経路ではありません</strong>
      （実際の経路は、本人への聞き取り等で職員が判断してください）。
      <span id="generated-at"></span>
    </div>
  </header>
  <section id="summary" aria-label="本人住所のハザード集計">
    <div class="summary-head">
      <h2>本人住所のハザード集計</h2>
      <button id="summary-toggle" type="button" aria-expanded="true" aria-controls="summary-body">集計をたたむ</button>
    </div>
    <div class="summary-body" id="summary-body">
      <div class="summary-rows" id="summary-rows"></div>
      <div class="summary-note" id="summary-note"></div>
    </div>
  </section>
  <div id="main">
    <div id="sidebar">
      <div class="section">
        <h2>要支援者を検索</h2>
        <input type="search" id="search" placeholder="resident_id または 住所で絞り込み" autocomplete="off">
        <!-- 既存データの事実だけによる絞り込み（複数選ぶと、検索とあわせてすべてに当てはまる人を表示） -->
        <div class="filters" id="filters" role="group" aria-label="一覧の絞り込み">
          <label><input type="checkbox" id="filter-coordinates"> <span>座標を確認</span></label>
          <label id="filter-hazard-label" hidden><input type="checkbox" id="filter-hazard"> <span>ハザード該当あり</span></label>
        </div>
        <div class="count" id="count"></div>
      </div>
      <div class="section grow">
        <ul class="results" id="results"></ul>
        <div class="count" id="more-note"></div>
      </div>
      <div class="section">
        <div class="nav">
          <button id="prev" type="button">← 前へ</button>
          <button id="next" type="button">次へ →</button>
          <span class="count" id="position"></span>
        </div>
      </div>
      <div class="section">
        <h2>地図の表示</h2>
        <div class="layers">
          <label>
            <input type="checkbox" id="basemap-toggle" checked>
            <span>背景地図</span>
          </label>
        </div>
        <div class="map-note" id="basemap-note"></div>
        <div class="map-note" id="view-bounds"></div>
      </div>
      <div class="section" id="layer-section">
        <h2>ハザード区域の表示</h2>
        <div class="layers" id="layers"></div>
        <div class="nav" style="margin-top:8px">
          <button id="layers-all" type="button">すべて表示</button>
          <button id="layers-none" type="button">すべて非表示</button>
        </div>
        <div class="count">要支援者を選ぶと、その人に関係する種別を自動で表示します。</div>
      </div>
    </div>
    <div id="content">
      <div id="map"></div>
      <div id="map-fallback"></div>
      <div id="map-attribution"></div>
      <div id="detail">
        <div class="detail-head">
          <div id="selected-summary"></div>
          <button id="detail-toggle" type="button" aria-expanded="true" aria-controls="detail-body">候補詳細をたたむ</button>
        </div>
        <div id="detail-body">
          <div id="candidates"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="review-data">__REVIEW_DATA_JSON__</script>
<script src="assets/js/leaflet.js"></script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("review-data").textContent);
  var RESIDENTS = DATA.residents || [];
  var HAZARD_LAYERS = DATA.hazard_layers || [];
  var SUMMARY = DATA.summary || null;
  var BASEMAP = DATA.basemap;
  var BASEMAP_ATTRIBUTION = DATA.basemap_attribution;
  var RESULT_LIMIT = 50;
  var RANK_COLORS = ["#c62828", "#ef6c00", "#b58900"];
  var RESIDENT_COLOR = "#14213d";

  var map = null;
  var featureLayer = null;
  var graticuleLayer = null;
  var basemapLayer = null;
  var overlays = {};
  var filtered = [];
  var selectedIndex = -1;
  var activeRank = null;

  function el(id) { return document.getElementById(id); }

  function setText(node, value) { node.textContent = value == null ? "" : String(value); }

  function createElement(tag, className) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    return node;
  }

  // Leafletのツールチップは、文字列を渡すとHTMLとして解釈される。避難所名のような
  // 利用者データがHTMLとして扱われないよう、必ずDOM要素にして渡す。
  function textTooltip(text) {
    var node = document.createElement("span");
    node.textContent = text;
    return node;
  }

  // ---- 地図の初期化 ----
  // Leaflet本体・背景地図PNG・ハザードPNGはいずれもこの成果物へ同梱しているため、
  // 外部通信なしで地図・背景地図・ハザード区域を表示できる（閉域環境での利用を想定）。
  //
  // 表示順は「背景地図 → ハザードPNG → 直線 → 要支援者・候補避難所」で固定したいため、
  // レイヤーの追加・削除順に依存しないよう、専用のpane（重なり順を決める階層）を
  // 用意してzIndexで順序を固定する（basemapPane=200 < hazardPane=300
  // < 直線・線を置く既定のoverlayPane=400 < マーカーの既定のmarkerPane=600）。
  //
  // 拡大・縮小できる範囲を、市内の確認に必要な範囲に限る。制限しないと、ホイール操作を
  // 続けるだけで際限なく拡大・縮小でき、背景地図・マーカーが画面から消えて、どこを見ているのか
  // 分からなくなる（背景地図は最大でもズーム15相当の画像のため、18より先は拡大しても細部は増えない）。
  var MIN_ZOOM = 10;
  var MAX_ZOOM = 18;
  // 起動直後（要支援者を選ぶ前）の表示位置
  var INITIAL_CENTER = [26.125, 127.68];
  var INITIAL_ZOOM = 13;

  function initMap() {
    if (typeof L === "undefined") {
      el("map").style.display = "none";
      var fallback = el("map-fallback");
      fallback.style.display = "block";
      setText(fallback,
        "地図ライブラリ（Leaflet）を読み込めませんでした。review.html と同じ場所の " +
        "assets フォルダごと展開されているか確認してください。" +
        "検索・候補一覧はこのまま利用できます。");
      return;
    }
    map = L.map("map", { minZoom: MIN_ZOOM, maxZoom: MAX_ZOOM }).setView(INITIAL_CENTER, INITIAL_ZOOM);
    map.createPane("basemapPane").style.zIndex = 200;
    map.createPane("hazardPane").style.zIndex = 300;
    featureLayer = L.layerGroup().addTo(map);
    graticuleLayer = L.layerGroup().addTo(map);
    initBasemap();
    buildOverlays();
    map.on("moveend", drawGraticule);
    drawGraticule();
    renderAttribution();
  }

  // ---- 背景地図（同梱のオフラインPNG。既定でON、外部通信なし） ----
  function initBasemap() {
    basemapLayer = L.imageOverlay(BASEMAP.image, BASEMAP.bounds, { pane: "basemapPane" });
    basemapLayer.once("add", function () {
      basemapLayer.getElement().addEventListener("error", function () {
        var note = el("basemap-note");
        note.className = "map-note warn";
        setText(note,
          "背景地図画像を読み込めませんでした。review.html と同じ場所に " +
          "assets フォルダごと展開されているか確認してください。");
      });
    });
    setBasemapEnabled(el("basemap-toggle").checked);
  }

  function setBasemapEnabled(enabled) {
    if (!map || !basemapLayer) { return; }
    if (enabled) {
      if (!map.hasLayer(basemapLayer)) { basemapLayer.addTo(map); }
    } else if (map.hasLayer(basemapLayer)) {
      map.removeLayer(basemapLayer);
    }
  }

  // ---- 出典表示（国土地理院。地理院タイルを画像化して同梱しているための表記） ----
  function renderAttribution() {
    setText(el("map-attribution"),
      "背景地図: " + BASEMAP_ATTRIBUTION + "（地理院タイルをオフライン用に画像化して同梱）");
  }

  // ---- 経緯度グリッド（位置の目安。背景地図に重ねて表示する） ----
  var GRATICULE_STEPS = [1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01, 0.005, 0.002, 0.001];

  function graticuleStep(span) {
    for (var i = 0; i < GRATICULE_STEPS.length; i += 1) {
      if (span / GRATICULE_STEPS[i] >= 4) { return GRATICULE_STEPS[i]; }
    }
    return GRATICULE_STEPS[GRATICULE_STEPS.length - 1];
  }

  function drawGraticule() {
    if (!map || !graticuleLayer) { return; }
    graticuleLayer.clearLayers();
    var bounds = map.getBounds();
    var south = bounds.getSouth(), north = bounds.getNorth();
    var west = bounds.getWest(), east = bounds.getEast();
    var step = graticuleStep(Math.max(north - south, east - west));
    // 候補の直線と見分けられるよう、グリッド線には専用のクラス名を付ける
    var style = {
      className: "graticule-line",
      color: "#9aa5b1", weight: 1, opacity: 0.5, interactive: false
    };

    for (var lat = Math.ceil(south / step) * step; lat <= north; lat += step) {
      L.polyline([[lat, west], [lat, east]], style).addTo(graticuleLayer);
    }
    for (var lon = Math.ceil(west / step) * step; lon <= east; lon += step) {
      L.polyline([[south, lon], [north, lon]], style).addTo(graticuleLayer);
    }

    setText(el("view-bounds"),
      "表示範囲 緯度 " + south.toFixed(4) + "〜" + north.toFixed(4)
      + " / 経度 " + west.toFixed(4) + "〜" + east.toFixed(4)
      + "（グリッド間隔 " + step + "度）");
  }

  function buildOverlays() {
    HAZARD_LAYERS.forEach(function (layer) {
      overlays[layer.key] = L.imageOverlay(layer.image, layer.bounds, {
        opacity: 0.45, pane: "hazardPane"
      });
    });
  }

  // ---- ハザードレイヤ操作 ----
  function renderLayerControls() {
    var container = el("layers");
    container.textContent = "";
    if (!HAZARD_LAYERS.length) {
      el("layer-section").style.display = "none";
      return;
    }
    HAZARD_LAYERS.forEach(function (layer) {
      var label = createElement("label");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.dataset.key = layer.key;
      input.addEventListener("change", function () {
        setLayerEnabled(layer.key, input.checked);
      });
      var swatch = createElement("span", "swatch");
      swatch.style.background = layer.color;
      var text = document.createElement("span");
      setText(text, layer.label);
      label.appendChild(input);
      label.appendChild(swatch);
      label.appendChild(text);
      container.appendChild(label);
    });
  }

  function setLayerEnabled(key, enabled) {
    var checkbox = document.querySelector('#layers input[data-key="' + key + '"]');
    if (checkbox) { checkbox.checked = enabled; }
    var overlay = overlays[key];
    if (!map || !overlay) { return; }
    if (enabled) {
      if (!map.hasLayer(overlay)) { overlay.addTo(map); }
    } else if (map.hasLayer(overlay)) {
      map.removeLayer(overlay);
    }
  }

  function setAllLayers(enabled) {
    HAZARD_LAYERS.forEach(function (layer) { setLayerEnabled(layer.key, enabled); });
  }

  function applyRelevantLayers(resident) {
    var relevant = {};
    (resident.hazards || []).forEach(function (hazard) { relevant[hazard.key] = true; });
    HAZARD_LAYERS.forEach(function (layer) {
      setLayerEnabled(layer.key, Boolean(relevant[layer.key]));
    });
  }

  // ---- 検索・一覧 ----
  function normalize(value) { return (value == null ? "" : String(value)).toLowerCase(); }

  // ---- 一覧の絞り込み（既存データの事実だけを使う。独自の評価・優先度は付けない） ----
  // 座標を確認        : match_status が ok 以外（no_coordinates・invalid_coordinates・想定外の値）
  // ハザード該当あり  : 本人の地点が、いずれかのハザード区域に該当する（ハザード判定を実施した場合だけ表示）
  // 複数選んだ場合と文字検索は、すべてに当てはまる人（AND）を表示する。
  var FILTERS = [
    { id: "filter-coordinates", available: function () { return true; },
      test: function (resident) { return resident.match_status !== "ok"; } },
    { id: "filter-hazard", label: "filter-hazard-label",
      available: function () { return Boolean(DATA.hazard_checked); },
      test: function (resident) { return resident.resident_in_hazard === true; } }
  ];

  // 使える絞り込みだけを表示し、それぞれに当てはまる人数を添える（何件あるかが事前に分かるように）
  function initFilters() {
    FILTERS.forEach(function (filter) {
      var input = el(filter.id);
      if (!filter.available()) {
        input.checked = false;
        return;
      }
      if (filter.label) { el(filter.label).hidden = false; }
      var total = 0;
      RESIDENTS.forEach(function (resident) { if (filter.test(resident)) { total += 1; } });
      var number = createElement("span", "filter-count");
      setText(number, "(" + total + ")");
      input.parentNode.appendChild(number);
      input.addEventListener("change", applyFilter);
    });
  }

  function activeFilters() {
    return FILTERS.filter(function (filter) { return filter.available() && el(filter.id).checked; });
  }

  function applyFilter() {
    var query = normalize(el("search").value).trim();
    var filters = activeFilters();
    filtered = [];
    for (var i = 0; i < RESIDENTS.length; i += 1) {
      var resident = RESIDENTS[i];
      var matchesQuery = !query
        || normalize(resident.resident_id).indexOf(query) >= 0
        || normalize(resident.address).indexOf(query) >= 0;
      if (matchesQuery && filters.every(function (filter) { return filter.test(resident); })) {
        filtered.push(i);
      }
    }
    if (filtered.indexOf(selectedIndex) < 0) {
      select(filtered.length ? filtered[0] : -1);
    } else {
      renderResults();
      updatePosition();
    }
  }

  // 一覧は一度にRESULT_LIMIT件までしか描かない（何千件でも検索のたびに重くならないようにするため）。
  // 描く範囲は選択中の要支援者を含むページにする。ここを常に先頭からにすると、「次へ」で
  // RESULT_LIMIT件目より後ろへ進んだときに、選択中の行が一覧から消えてしまう。
  function visibleRange() {
    var position = filtered.indexOf(selectedIndex);
    var start = position < 0 ? 0 : Math.floor(position / RESULT_LIMIT) * RESULT_LIMIT;
    return { start: start, end: Math.min(start + RESULT_LIMIT, filtered.length) };
  }

  function renderResults() {
    var list = el("results");
    list.textContent = "";
    var range = visibleRange();
    for (var i = range.start; i < range.end; i += 1) {
      list.appendChild(createResultItem(filtered[i]));
    }
    setText(el("count"), "該当 " + filtered.length + "件 / 全 " + RESIDENTS.length + "件");
    setText(el("more-note"),
      filtered.length > RESULT_LIMIT
        ? "該当" + filtered.length + "件のうち " + (range.start + 1) + "〜" + range.end
          + "件目を表示しています（検索・絞り込みで対象を減らせます）。"
        : "");
    var selected = list.querySelector("li.selected");
    if (selected && selected.scrollIntoView) { selected.scrollIntoView({ block: "nearest" }); }
  }

  // ---- 位置情報の状態（match_status）の表示 ----
  // 内部の状態名（ok / no_coordinates / invalid_coordinates）は職員向けの言葉に置き換える。
  // ok は表示しない。想定外の値は正常扱いにせず、確認が必要であることを示す。
  function coordinateStatus(resident) {
    var status = resident.match_status;
    if (status === "ok") { return null; }
    if (status === "no_coordinates") {
      return { badge: "座標なし", text: "座標がありません。元データの住所・緯度経度を確認してください。" };
    }
    if (status === "invalid_coordinates") {
      return { badge: "座標を確認",
               text: "座標を確認してください（緯度・経度が数値として読めないか、範囲外です）。" };
    }
    return { badge: "要確認", text: "位置情報の状態を確認してください（状態: " + status + "）。" };
  }

  function createResultItem(index) {
    var resident = RESIDENTS[index];
    var item = createElement("li", index === selectedIndex ? "selected" : "");
    item.dataset.index = String(index);
    var rid = createElement("div", "rid");
    setText(rid, resident.resident_id);
    var listStatus = coordinateStatus(resident);
    if (listStatus || !resident.has_coordinates) {
      var badge = createElement("span", "badge");
      setText(badge, listStatus ? listStatus.badge : "座標なし");
      rid.appendChild(badge);
    }
    var addr = createElement("div", "addr");
    setText(addr, resident.address);
    item.appendChild(rid);
    item.appendChild(addr);
    item.addEventListener("click", function () { select(index); });
    return item;
  }

  function updatePosition() {
    var position = filtered.indexOf(selectedIndex);
    setText(el("position"), position >= 0 ? (position + 1) + " / " + filtered.length : "");
    el("prev").disabled = position <= 0;
    el("next").disabled = position < 0 || position >= filtered.length - 1;
  }

  function step(offset) {
    var position = filtered.indexOf(selectedIndex);
    if (position < 0) { return; }
    var next = position + offset;
    if (next < 0 || next >= filtered.length) { return; }
    select(filtered[next]);
  }

  // ---- 選択 ----
  function select(index) {
    selectedIndex = index;
    activeRank = null;
    renderResults();
    updatePosition();
    renderSelected();
  }

  function renderSelected() {
    var summary = el("selected-summary");
    var candidates = el("candidates");
    summary.textContent = "";
    candidates.textContent = "";
    if (featureLayer) { featureLayer.clearLayers(); }

    updateOverviewButton(null);
    if (selectedIndex < 0) {
      // 該当する要支援者がいない（検索・絞り込みで0件）場合は、直前の要支援者に合わせた表示を残さない。
      // 要支援者・候補・直線（上で消去済み）に加えて、ハザード区域の表示（チェックも）を外し、
      // 地図を全体が見える位置へ戻す。再び誰かを選べば、その人に必要なハザード区域の表示に戻る。
      lastViewPoints = null;
      setAllLayers(false);
      resetMapView();
      setText(summary, RESIDENTS.length && !filtered.length
        ? "検索・絞り込みの条件に該当する要支援者はいません。"
        : "要支援者を選択してください。");
      return;
    }

    var resident = RESIDENTS[selectedIndex];
    applyRelevantLayers(resident);
    updateOverviewButton(resident);

    var title = createElement("div", "title");
    setText(title, resident.resident_id);
    var addr = createElement("div", "addr");
    setText(addr, resident.address);
    summary.appendChild(title);
    summary.appendChild(addr);

    // 座標が使えない場合は、状態と「候補が算出されていない」ことをこの1行にまとめる
    // （経路情報欄・候補表の欄で同じことを繰り返さない）
    var coordinate = coordinateStatus(resident);
    if (coordinate || !resident.has_coordinates) {
      var status = createElement("div", "status-warn");
      setText(status, (coordinate ? coordinate.text : "")
        + (resident.has_coordinates ? "" : "地図に表示できる座標が無いため、避難所候補は算出されていません。"));
      summary.appendChild(status);
    }

    summary.appendChild(residentHazardLine(resident));

    renderCandidateTable(resident);
    drawResident(resident);
  }

  // ---- 本人住所のハザード ----
  // 判定の対象は要支援者本人の地点だけ。大分類（津波・高潮・洪水・土砂災害など）ごとに、公式データの
  // 詳細区分（浸水深の区分・計画規模／想定最大規模・現象の種類など）を、言い換えずにそのまま並べる。
  // 判定していない場合（ハザード判定を実施していない・座標が使えない）は、「該当なし」とは表示しない。
  function residentHazardLine(resident) {
    var line = createElement("div");
    if (!DATA.hazard_checked) {
      line.className = "hazard-no";
      setText(line, "本人住所のハザード: 判定していません（ハザード判定を実施していません）");
      return line;
    }
    if (!resident.has_coordinates || resident.hazards === null || resident.hazards === undefined) {
      line.className = "hazard-no";
      setText(line, "本人住所のハザード: 判定できません（座標がありません）");
      return line;
    }
    if (!resident.hazards.length) {
      line.className = "hazard-no";
      setText(line, "本人住所のハザード: 該当なし");
      return line;
    }
    line.className = "hazard-yes";
    line.appendChild(document.createTextNode("本人住所のハザード: "));
    resident.hazards.forEach(function (hazard) {
      var group = createElement("span", "hazard-group");
      setText(group, hazard.details.length ? hazard.category + "（" + hazard.details.join("・") + "）"
                                           : hazard.category);
      line.appendChild(group);
    });
    return line;
  }

  // ---- 候補の選択（マウスのクリックとキーボードの Enter / Space で共通の処理） ----
  // 選択した候補の直線と避難所名を強調する。選択中の行をもう一度押すと選択を外す。
  // 候補表は描き直すため、操作した行にフォーカスがあった場合は、描き直した同じ候補の行へ戻す。
  function selectCandidate(resident, rank) {
    var focused = document.activeElement;
    var keepFocus = focused && focused.closest && focused.closest("#candidates tbody tr") !== null;
    activeRank = activeRank === rank ? null : rank;
    el("candidates").textContent = "";
    renderCandidateTable(resident);
    drawResident(resident);
    if (keepFocus) {
      var row = document.querySelector('#candidates tbody tr[data-rank="' + rank + '"]');
      if (row) { row.focus({ preventScroll: true }); }
    }
  }

  // ---- 距離欄 ----
  // 表示の単位だけを読みやすくする（1000m以上は km）。データの値は変えない。
  function formatDistance(meters) {
    if (meters == null) { return ""; }
    return meters >= 1000 ? (meters / 1000).toFixed(2) + " km" : Math.round(meters) + " m";
  }

  function renderCandidateTable(resident) {
    var container = el("candidates");
    if (!resident.candidates.length) {
      if (!resident.has_coordinates) { return; }  // 概要で「候補は算出されていません」と表示済み
      var empty = createElement("div", "empty");
      setText(empty, "避難所候補はありません。");
      container.appendChild(empty);
      return;
    }

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    ["順位", "避難所名", "直線距離"]
      .forEach(function (name) {
        var th = document.createElement("th");
        setText(th, name);
        headRow.appendChild(th);
      });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    resident.candidates.forEach(function (candidate) {
      var row = document.createElement("tr");
      row.dataset.rank = String(candidate.rank);
      // キーボードでも候補を選べるよう、行をTabで移動できるようにし、選択状態を支援技術にも伝える
      row.tabIndex = 0;
      row.setAttribute("aria-selected", String(activeRank === candidate.rank));
      if (activeRank === candidate.rank) {
        row.className = "active";
        row.setAttribute("aria-current", "true");
      }

      var rankCell = document.createElement("td");
      var chip = createElement("span", "rank-chip");
      chip.style.background = RANK_COLORS[candidate.rank - 1] || "#555";
      setText(chip, candidate.rank);
      rankCell.appendChild(chip);
      var rankLabel = document.createElement("span");
      setText(rankLabel, " 候補" + candidate.rank);
      rankCell.appendChild(rankLabel);
      if (activeRank === candidate.rank) {
        var selectedLabel = createElement("span", "selected-label");
        setText(selectedLabel, "選択中");
        rankCell.appendChild(selectedLabel);
      }
      row.appendChild(rankCell);

      var nameCell = document.createElement("td");
      setText(nameCell, candidate.name);
      row.appendChild(nameCell);

      var distanceCell = document.createElement("td");
      setText(distanceCell, formatDistance(candidate.distance_m));
      row.appendChild(distanceCell);

      row.addEventListener("click", function () { selectCandidate(resident, candidate.rank); });
      row.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " " || event.key === "Spacebar") {
          event.preventDefault();  // Space で画面がスクロールしないようにする
          selectCandidate(resident, candidate.rank);
        }
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    container.appendChild(table);

    // 表の意味だけをここで説明する（安全性に関する全体の注意は画面上部にまとめている）
    var note = createElement("div", "count");
    setText(note,
      "候補の順位は、本人の地点から避難所までの直線距離だけで決めています"
      + "（避難所のハザード等では変わりません）。実際に通る経路は、本人への聞き取り等で職員が判断してください。");
    container.appendChild(note);
  }

  // ---- 地図描画（選択した1人だけ） ----
  // 本人の地点・候補避難所1〜3・本人と各候補を結ぶ直線を描く。表示範囲は、本人と候補がすべて入る範囲にする
  // （拡大しすぎないよう、ズーム17までにする）。
  var FOCUS_MAX_ZOOM = 17;
  var lastViewPoints = null;

  function drawResident(resident) {
    if (!map || !featureLayer) { return; }
    featureLayer.clearLayers();
    lastViewPoints = null;
    if (!resident.has_coordinates) { return; }

    var residentLatLng = [resident.latitude, resident.longitude];
    var allPoints = [residentLatLng];

    resident.candidates.forEach(function (candidate) {
      var candidateLatLng = [candidate.latitude, candidate.longitude];
      allPoints.push(candidateLatLng);
      var color = RANK_COLORS[candidate.rank - 1] || "#555";
      var emphasised = activeRank === candidate.rank;

      L.polyline([residentLatLng, candidateLatLng], {
        className: "straight-line",
        color: color,
        weight: emphasised ? 5 : 3,
        opacity: activeRank && !emphasised ? 0.35 : 0.9,
        dashArray: "6 5"
      }).addTo(featureLayer).bindTooltip(
        textTooltip("候補" + candidate.rank + "への直線（実際に通る経路ではありません）"));

      // 選択中の候補は、マーカーを大きく・黒い外枠付きにし、「候補N 避難所名」を常に表示する
      var size = emphasised ? 30 : 22;
      var marker = L.marker(candidateLatLng, {
        icon: L.divIcon({
          className: "",
          // ここで組み立てるのは候補番号（このNotebookが振る整数）と配色だけで、
          // 利用者データは入れない
          html: '<div class="marker-pin' + (emphasised ? " selected" : "") + '" style="background:'
            + color + ';">' + candidate.rank + '</div>',
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2]
        }),
        opacity: activeRank && !emphasised ? 0.5 : 1,
        zIndexOffset: emphasised ? 1000 : 0
      }).addTo(featureLayer);
      marker.bindTooltip(textTooltip("候補" + candidate.rank + " " + candidate.name), emphasised
        ? { permanent: true, direction: "top", offset: [0, -16], className: "selected-candidate-label" }
        : {});
    });

    L.circleMarker(residentLatLng, {
      className: "resident-marker",
      radius: 9, color: "#fff", weight: 2, fillColor: RESIDENT_COLOR, fillOpacity: 1
    }).addTo(featureLayer).bindTooltip(textTooltip("本人地点"));

    lastViewPoints = allPoints;
    fitView();
  }

  // 地図を全体が見える位置へ戻す。背景地図の範囲（要支援者・避難所の全体を覆う範囲）を使い、
  // 背景地図の情報が無い場合は起動直後の表示位置にする。
  function resetMapView() {
    if (!map) { return; }
    map.invalidateSize({ animate: false });
    if (BASEMAP && BASEMAP.bounds) {
      map.fitBounds(BASEMAP.bounds);
    } else {
      map.setView(INITIAL_CENTER, INITIAL_ZOOM);
    }
  }

  function fitView() {
    if (!map || !lastViewPoints) { return; }
    try {
      // 候補詳細の高さ（折りたたみ）で地図の大きさが変わるため、
      // 収める範囲を計算する前にLeafletへ現在の大きさを取り直させる
      map.invalidateSize({ animate: false });
      map.fitBounds(L.latLngBounds(lastViewPoints).pad(0.25), { maxZoom: FOCUS_MAX_ZOOM });
    } catch (error) {
      map.setView(lastViewPoints[0], 15);
    }
  }

  // ---- 全候補を表示 ----
  // 本人の地点と候補1〜3の避難所が入る範囲へ地図を戻す（拡大・移動したあとに全体へ戻す用）。
  // 候補の選択はそのまま。
  var overviewButton = null;

  function initOverviewControl() {
    if (!map) { return; }
    var OverviewControl = L.Control.extend({
      options: { position: "topleft" },
      onAdd: function () {
        var container = L.DomUtil.create("div", "leaflet-bar leaflet-control overview-control");
        overviewButton = L.DomUtil.create("button", "", container);
        overviewButton.type = "button";
        overviewButton.id = "show-all-candidates";
        setText(overviewButton, "全候補を表示");
        overviewButton.title = "本人の地点と候補避難所がすべて入る範囲を表示します";
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.on(overviewButton, "click", showAllCandidates);
        return container;
      }
    });
    new OverviewControl().addTo(map);
  }

  function updateOverviewButton(resident) {
    if (!overviewButton) { return; }
    overviewButton.disabled = !resident || !resident.has_coordinates || !resident.candidates.length;
  }

  function showAllCandidates() {
    if (selectedIndex < 0) { return; }
    var resident = RESIDENTS[selectedIndex];
    if (!resident.has_coordinates || !resident.candidates.length) { return; }
    lastViewPoints = [[resident.latitude, resident.longitude]].concat(
      resident.candidates.map(function (candidate) { return [candidate.latitude, candidate.longitude]; }));
    fitView();
  }

  // ---- 候補詳細の折りたたみ ----
  // 候補表・表の注意書きをまとめて隠し、地図を広く使えるようにする（初期状態は表示）。
  function setDetailCollapsed(collapsed) {
    el("detail").classList.toggle("collapsed", collapsed);
    var button = el("detail-toggle");
    setText(button, collapsed ? "候補詳細を表示" : "候補詳細をたたむ");
    button.setAttribute("aria-expanded", String(!collapsed));
    fitView();
  }

  // ---- ハザード別の人数集計（画面上部） ----
  // 集計は、判定時に付けたハザードの大分類（津波・高潮・洪水・土砂災害など）を使い、人 × 大分類で重複を除いて
  // 数えたもの（表示の文字列は解析しない）。同じ人が複数の大分類に該当する場合はそれぞれに1人ずつ計上するため、
  // 各大分類の人数を合計しても「いずれかに該当」とは一致しない場合がある。
  // 座標が使えず判定できなかった人は、「ハザード該当なし」には含めず、「座標未取得」として別に数える。
  function formatCount(value) {
    return value == null ? "" : Number(value).toLocaleString("ja-JP");
  }

  function summaryItem(label, value, color) {
    var item = createElement("div", "summary-item");
    var labelNode = createElement("span", "label");
    if (color) {
      var swatch = createElement("span", "swatch");
      swatch.style.background = color;
      labelNode.appendChild(swatch);
    }
    labelNode.appendChild(document.createTextNode(label));
    var valueNode = createElement("span", "value");
    setText(valueNode, formatCount(value));
    item.appendChild(labelNode);
    item.appendChild(valueNode);
    return item;
  }

  function summaryGroup(title) {
    var group = createElement("div", "summary-group");
    var heading = createElement("div", "summary-group-title");
    setText(heading, title);
    group.appendChild(heading);
    return group;
  }

  function layerColor(key) {
    for (var i = 0; i < HAZARD_LAYERS.length; i += 1) {
      if (HAZARD_LAYERS[i].key === key) { return HAZARD_LAYERS[i].color; }
    }
    return null;
  }

  function renderSummary() {
    var rows = el("summary-rows");
    var note = el("summary-note");
    rows.textContent = "";
    if (!SUMMARY) { el("summary").hidden = true; return; }

    var counts = summaryGroup("件数");
    counts.appendChild(summaryItem("総件数", SUMMARY.total));
    counts.appendChild(summaryItem("座標あり", SUMMARY.with_coordinates));
    counts.appendChild(summaryItem("座標未取得", SUMMARY.without_coordinates));
    rows.appendChild(counts);

    if (!SUMMARY.hazard_checked) {
      setText(note, "ハザード判定を実施していないため、ハザードの集計はありません。");
      return;
    }

    var overall = summaryGroup("座標あり（ハザードを判定した人）");
    overall.appendChild(summaryItem("いずれかに該当", SUMMARY.any_hazard));
    overall.appendChild(summaryItem("ハザード該当なし", SUMMARY.no_hazard));
    rows.appendChild(overall);

    var byCategory = summaryGroup("ハザード大分類別（その大分類に該当する人数）");
    (SUMMARY.by_category || []).forEach(function (entry) {
      byCategory.appendChild(summaryItem(entry.category, entry.count, layerColor(entry.key)));
    });
    rows.appendChild(byCategory);

    setText(note,
      "同じ人が複数のハザードに該当する場合は、それぞれに1件ずつ計上しています。"
      + "このため、各大分類の人数を合計しても「いずれかに該当」とは一致しない場合があります。"
      + "座標未取得の人は、ハザードを判定できないため「ハザード該当なし」には含めていません。");
  }

  // ---- 起動 ----
  setText(el("generated-at"), DATA.generated_at ? "（作成: " + DATA.generated_at + "）" : "");
  initMap();
  initOverviewControl();
  renderSummary();
  initFilters();
  renderLayerControls();
  el("search").addEventListener("input", applyFilter);
  el("prev").addEventListener("click", function () { step(-1); });
  el("next").addEventListener("click", function () { step(1); });
  el("basemap-toggle").addEventListener("change", function (event) {
    setBasemapEnabled(event.target.checked);
  });
  el("summary-toggle").addEventListener("click", function () {
    var collapsed = !el("summary").classList.contains("collapsed");
    el("summary").classList.toggle("collapsed", collapsed);
    setText(el("summary-toggle"), collapsed ? "集計を表示" : "集計をたたむ");
    el("summary-toggle").setAttribute("aria-expanded", String(!collapsed));
    if (map) { map.invalidateSize({ animate: false }); }
  });
  el("detail-toggle").addEventListener("click", function () {
    setDetailCollapsed(!el("detail").classList.contains("collapsed"));
  });
  el("layers-all").addEventListener("click", function () { setAllLayers(true); });
  el("layers-none").addEventListener("click", function () { setAllLayers(false); });
  applyFilter();
})();
</script>
</body>
</html>
