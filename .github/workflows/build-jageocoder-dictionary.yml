name: 沖縄県用Jageocoder辞書生成

# Google Colab (Python 3.13) では、PyPI版 jageocoder-converter が現行の
# jageocoder 2.2系と非互換であることを実機で確認済み（AttributeError: 'LocalTree'
# object has no attribute 'engine' / 'create_trie_index'）。
# jageocoder 2.2対応が進んでいる jageocoder-converter の develop ブランチは
# Python 3.13を明示的にサポート対象外としているため、Colab上での辞書生成は行わず、
# Python 3.12のGitHub Actions上でのみ辞書を生成する。
#
# 再現性のため、jageocoder / jageocoder-converter とも動作確認済みのコミットSHAに
# 固定する（ブランチ名は参照しない）。jageocoder-converter の当該コミットは
# poetry.lock 上で jageocoder を隣接ディレクトリ ../jageocoder から参照する
# ローカルパス依存になっているため、両リポジトリを work/ 以下に隣接配置したうえで、
# jageocoder-converter 側は --no-deps でインストールし、他の依存関係は個別に入れる。

on:
  workflow_dispatch:
    inputs:
      accept_terms:
        description: >-
          jageocoder-converterが使用する住所データの利用規約を確認した場合のみ
          true にしてください。false のままでは辞書生成は実行されません。
        required: true
        type: boolean
        default: false

jobs:
  build-dictionary:
    if: ${{ inputs.accept_terms }}
    runs-on: ubuntu-latest
    env:
      # t-sagara/jageocoder の v2.2.1.1 タグが指すコミット。
      JAGEOCODER_COMMIT: cdf1129571bde69dfaa25781d945b26db56b8336
      # t-sagara/jageocoder-converter の develop ブランチ上のコミット
      # （jageocoder 2.2対応・create_trie_index() 実装を含む最新の動作確認済みコミット）。
      JAGEOCODER_CONVERTER_COMMIT: 38f7bdc3c3226314528d251d740765d2988f8c31
      PREF_CODE: "47"

    steps:
      - name: jageocoderをチェックアウト（固定コミット）
        uses: actions/checkout@v4
        with:
          repository: t-sagara/jageocoder
          ref: ${{ env.JAGEOCODER_COMMIT }}
          path: work/jageocoder

      - name: jageocoder-converterをチェックアウト（固定コミット）
        uses: actions/checkout@v4
        with:
          repository: t-sagara/jageocoder-converter
          ref: ${{ env.JAGEOCODER_CONVERTER_COMMIT }}
          path: work/jageocoder-converter

      - name: Python 3.12 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: jageocoderをインストール
        run: pip install ./work/jageocoder

      - name: jageocoder-converterの依存関係をインストール
        # jageocoder-converter自体が持つjageocoderへの依存は
        # ../jageocoder を指すローカルパス依存（develop=true）であり、
        # 単体のリポジトリとしてはpipで解決できないため、それ以外の
        # 依存関係のみを個別にインストールする。
        run: pip install "certifi>=2025.1.31" "docopt-ng" "jaconv>=0.3.4" "pyproj>=3.5.0"

      - name: jageocoder-converterをインストール（--no-deps）
        run: pip install --no-deps ./work/jageocoder-converter

      - name: インストールされたバージョンを表示
        run: |
          python --version
          python -c "import jageocoder; print('jageocoder:', jageocoder.__version__)"
          python -c "import jageocoder_converter; print('jageocoder-converter:', jageocoder_converter.__version__)"

      - name: 沖縄県（都道府県コード47）の辞書を生成
        working-directory: work
        run: python -m jageocoder_converter --db-dir=okinawa_db --quiet "${PREF_CODE}"

      - name: 辞書の読込・住所検索を確認
        working-directory: work
        run: |
          python <<'PY'
          import sys

          import jageocoder

          jageocoder.init(db_dir="okinawa_db")

          # 沖縄県那覇市泉崎にある沖縄県庁の住所（公開情報）で検索確認する。
          address = "沖縄県那覇市泉崎一丁目2番2号"
          results = jageocoder.searchNode(address)
          if not results:
              print(f"辞書から住所を検索できませんでした: {address}")
              sys.exit(1)

          node = results[0].node
          level = getattr(node, "level", None)
          print(f"matched: {node.get_fullname()} level={level} lon={node.x} lat={node.y}")

          # sheltermatch.ipynb と同じ street/parcel level (7) 以上の一致であることを確認する。
          if level is None or level < 7:
              print(f"街区・地番レベル(7)以上で一致しませんでした（level={level}）。")
              sys.exit(1)

          print("辞書として利用可能であることを確認しました。")
          PY

      - name: 辞書ディレクトリをZIP化
        # ZIP内に余計な親ディレクトリを含めないよう、辞書ディレクトリの中身を
        # トップレベルに格納する（jageocoder.init(db_dir=...)へそのまま渡せる構造）。
        working-directory: work/okinawa_db
        run: zip -r ../okinawa_jageocoder.zip .

      - name: 辞書ZIPをArtifactとして保存
        uses: actions/upload-artifact@v4
        with:
          name: okinawa-jageocoder-dictionary
          path: work/okinawa_jageocoder.zip
          retention-days: 30
