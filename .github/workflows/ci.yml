# 自動テスト（python -m unittest discover -s test）を、main 向けの Pull Request と main への push で実行する。
#
# CI で確認するのは、リポジトリ内の架空データだけで完結するテストに限る。実際の Google Colab での実行、
# OpenStreetMap の道路データ取得、公式ハザードデータ、実ブラウザでのレビュー画面の確認（experiments/ 配下）は
# CI の対象外で、従来どおり実機確認として行う。
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Google Colab の現行の Python に合わせる
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: 依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test/requirements.txt

      # 依存関係が入っていないとテストの一部が skip されるため、テストの前に import できることを確かめる
      # （インストールに失敗したまま「skip されただけで成功」にならないようにする）
      - name: 依存関係の確認
        run: |
          python -c "import numpy, pandas, scipy, networkx, shapely, pyproj, geopandas, matplotlib, requests, PIL; print('import OK')"
          python -m pip list --format=freeze | grep -iE '^(numpy|pandas|scipy|networkx|shapely|pyproj|geopandas|matplotlib|requests|pillow)=='

      # テスト中は外部へ接続できないようにする（到達できないプロキシを指定する）。テストはリポジトリ内の
      # 架空データだけで完結し、行政区域・道路・ハザード・避難所などの外部データを取得しないことを確かめる。
      # skip が1件でもあれば失敗にする（必要なテストが実行されなかったことに気付けるようにする）。
      - name: 自動テスト
        env:
          # Actions の env は大文字・小文字を区別しないため、大文字だけで指定する
          # （Python の requests / urllib は大文字の変数も読む）
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
          MPLBACKEND: Agg
        run: |
          set -o pipefail
          python -m unittest discover -s test -v 2>&1 | tee test-output.txt
          if grep -q "skipped" test-output.txt; then
            echo "::error::skip されたテストがあります（依存関係の不足などを確認してください）"
            exit 1
          fi
          grep -E "^Ran [0-9]+ tests" test-output.txt
