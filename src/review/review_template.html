<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>避難所候補レビュー（sheltermatch）</title>
<link rel="stylesheet" href="assets/css/leaflet.css">
<style>
  /* 画面設計の方針: 地図を最優先の領域にし、検索・一覧は左、地図の表示設定は地図の隣、選択した人の判定結果と
     避難所候補は地図の下に置く。配色・部品は外部ライブラリ（CDN・Webフォント）に頼らず、この1ファイルで完結させる。
     読みやすさのため、本文は16px・表やフォームは14px以上とし、角丸は4px以下、装飾（影・グラデーション）は使わない。 */
  :root {
    --ink: #161616;
    --ink-2: #4d4d4d;       /* 補助の文字（白地で7:1以上） */
    --bg: #f4f4f4;
    --panel: #ffffff;
    --line: #d0d0d0;        /* 区切り線 */
    --control: #6f6f6f;     /* 入力欄・ボタンの枠線（3:1以上） */
    --primary: #0017c1;     /* 操作・選択中を示す青 */
    --primary-bg: #e8f1fe;
    --hover: #ececec;
    --focus: #ffd43d;       /* フォーカスの内側の輪（外側は黒） */
    --warn-ink: #7a3300;
    --warn-bg: #fff4e5;
    --warn-line: #b45309;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic", Meiryo, sans-serif;
    font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--bg);
  }
  h1, h2, h3, p { margin: 0; }
  #app { display: flex; flex-direction: column; min-height: 100%; }

  /* ---- フォーカス（どの部品にいるかを、黒と黄の二重の輪で示す） ---- */
  :focus-visible {
    outline: 3px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 2px var(--focus);
  }
  .resident-item:focus-visible, .cand-btn:focus-visible {
    outline-offset: -3px; box-shadow: inset 0 0 0 6px var(--focus);
  }

  /* ---- 部品 ---- */
  button {
    font: inherit; font-size: 14px; min-height: 36px; padding: 0 12px; color: var(--primary);
    background: var(--panel); border: 1px solid var(--primary); border-radius: 4px; cursor: pointer;
  }
  button:hover:enabled { background: var(--primary-bg); }
  button:disabled { color: #6f6f6f; border-color: #c6c6c6; background: var(--bg); cursor: default; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type="search"] {
    width: 100%; min-height: 44px; padding: 6px 10px; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--control); border-radius: 4px;
  }
  input[type="checkbox"] { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--primary); }
  .check {
    display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 4px; font-size: 14px; cursor: pointer;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .note { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .note.warn, .status-warn { color: var(--warn-ink); font-weight: 600; }
  .swatch { width: 14px; height: 14px; display: inline-block; flex: none; border: 1px solid rgba(0,0,0,.35); }
  .tag {
    display: inline-block; padding: 0 6px; font-size: 13px; line-height: 1.5; font-weight: 600; white-space: nowrap;
    border: 1px solid currentColor; border-radius: 2px; background: var(--panel);
  }
  .tag.warn { color: var(--warn-ink); }
  .tag.hit { color: #fff; background: var(--warn-ink); border-color: var(--warn-ink); }
  .tag.selected { color: var(--primary); }

  /* ---- 見出し部 ---- */
  #page-header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #page-header h1 { font-size: 18px; line-height: 1.4; }
  #page-header .generated { display: block; font-size: 13px; font-weight: 400; color: var(--ink-2); }
  .notice { flex: 1 1 420px; font-size: 13px; line-height: 1.6; color: var(--ink-2); }
  .notice strong { color: var(--warn-ink); }

  /* ---- ハザード集計（補助情報。たたむと見出しだけになる） ---- */
  #summary {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 20px; align-items: start;
    padding: 6px 16px 8px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .summary-title { position: relative; }
  .summary-title h2 { font-size: 14px; line-height: 1.5; padding-top: 2px; }
  #summary-help { font-size: 13px; color: var(--ink-2); }
  #summary-help summary { cursor: pointer; display: list-item; list-style: disclosure-closed inside; padding: 2px 0; color: var(--primary); text-decoration: underline; }
  #summary-help[open] summary { list-style-type: disclosure-open; }
  /* 集計の読み方は、開いたときだけ、下の領域に重ねて表示する（普段は場所を取らない） */
  #summary-help p {
    position: absolute; left: 0; top: 100%; z-index: 2000; width: min(34rem, calc(100vw - 24px)); padding: 8px 12px;
    line-height: 1.6; background: var(--panel); border: 1px solid var(--control); border-radius: 4px; color: var(--ink);
  }
  #summary-toggle { min-height: 32px; }
  #summary.collapsed .summary-body { display: none; }
  .summary-rows { display: flex; flex-wrap: wrap; gap: 4px 0; }
  .summary-group { display: flex; flex-direction: column; gap: 0; padding-right: 20px; }
  .summary-group + .summary-group { padding-left: 20px; border-left: 1px solid var(--line); }
  .summary-group-title { font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .summary-items { display: flex; flex-wrap: wrap; gap: 0 18px; }
  .summary-item { display: flex; align-items: baseline; gap: 6px; }
  .summary-item .label { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; }
  .summary-item .value { font-size: 20px; font-weight: 700; line-height: 1.4; font-variant-numeric: tabular-nums; }
  .summary-note { margin-top: 2px; }

  /* ---- 全体の配置 ----
     狭い画面（または高さが足りない画面）では、要支援者 → 地図の設定 → 地図 → 判定結果・候補の順に縦に並べ、画面全体を
     スクロールして見る。広い画面では画面の高さに収め、一覧・詳細だけを内側でスクロールする。 */
  #main {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "list" "tools" "map" "detail";
  }
  #sidebar { grid-area: list; }
  #map-tools { grid-area: tools; }
  #map-area { grid-area: map; }
  #detail { grid-area: detail; }

  /* ---- 左: 要支援者の検索・絞り込み・一覧・前後移動 ---- */
  #sidebar {
    display: flex; flex-direction: column; min-height: 0; padding: 12px 12px 0; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #sidebar h2, #map-tools h2, #detail h2 { font-size: 16px; line-height: 1.5; }
  .field-label { display: block; margin: 8px 0 4px; font-size: 14px; font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 0 12px; margin-top: 2px; }
  .filter-count { color: var(--ink-2); }
  #count { margin-top: 2px; font-size: 14px; color: var(--ink-2); }
  #results-scroll { position: relative; margin: 6px -12px 0; max-height: 17rem; overflow-y: auto; border-top: 1px solid var(--line); }
  ul.results { list-style: none; margin: 0; padding: 0; }
  .resident-item {
    display: block; width: 100%; min-height: 56px; padding: 6px 12px 6px 16px; text-align: left;
    font-size: 14px; line-height: 1.4; color: var(--ink); background: var(--panel);
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  }
  .resident-item:hover:enabled { background: var(--hover); }
  .resident-item[aria-current="true"] { background: var(--primary-bg); box-shadow: inset 4px 0 0 var(--primary); }
  .resident-item[aria-current="true"] .rid { font-weight: 700; }
  .resident-item .rid { font-size: 16px; font-weight: 600; }
  .resident-item .tag { margin-left: 6px; vertical-align: 1px; }
  .addr { font-size: 14px; color: var(--ink-2); word-break: break-all; }
  .list-empty { padding: 12px 16px; font-size: 14px; color: var(--ink-2); }
  #more-note { font-size: 13px; color: var(--ink-2); padding: 6px 0 0; }
  #more-note:empty { display: none; }
  .nav { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  .nav button { min-height: 40px; min-width: 6.5em; }
  #position { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* ---- 地図の表示設定（地図の隣。狭いときは地図の上に横並び） ---- */
  #map-tools {
    display: flex; flex-wrap: wrap; align-items: center; gap: 2px 24px; padding: 6px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .tool-group { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; }
  .tool-title { font-size: 14px; font-weight: 600; }
  .layers { display: flex; flex-wrap: wrap; gap: 0 8px; }
  #basemap-note:empty { display: none; }
  #layer-hint { flex-basis: 100%; }

  /* ---- 中央: 地図 ---- */
  #map-area { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
  #map { height: min(70vh, 520px); min-height: 320px; background: #f0f3f6; }
  #map-fallback { display: none; padding: 16px; color: var(--ink-2); }
  #map-meta {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 0 16px; padding: 4px 12px;
    font-size: 13px; line-height: 1.5; color: var(--ink-2); border-top: 1px solid var(--line);
  }
  #bounds-details { color: #5c5c5c; }
  #bounds-details summary { cursor: pointer; display: list-item; list-style: disclosure-closed inside; padding: 0 2px; }
  #bounds-details[open] summary { list-style-type: disclosure-open; }
  .leaflet-touch .leaflet-bar a { width: 36px; height: 36px; line-height: 36px; }
  .leaflet-container:focus-visible { outline-offset: -3px; box-shadow: inset 0 0 0 6px var(--focus); }
  .overview-control button {
    min-height: 36px; border: 0; border-radius: 4px; padding: 0 10px; font-size: 14px; color: var(--primary); background: #fff;
  }
  .marker-pin {
    width: 24px; height: 24px; line-height: 20px; text-align: center; border-radius: 50%; border: 2px solid #fff;
    color: #fff; background: var(--ink); font-weight: 700; font-size: 13px; box-shadow: 0 0 0 1px rgba(0,0,0,.5);
  }
  /* 選択中の候補は、ほかより大きく、黄色の縁と黒い外枠で示す（色の違いだけに頼らない） */
  .marker-pin.selected {
    width: 32px; height: 32px; line-height: 26px; font-size: 16px; border: 3px solid var(--focus); box-shadow: 0 0 0 2px var(--ink);
  }
  .resident-pin { width: 22px; height: 22px; background: #0b1d6b; border: 3px solid #fff; transform: rotate(45deg); box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  .leaflet-tooltip { font-size: 13px; }
  .leaflet-tooltip.selected-candidate-label { font-weight: 700; border: 2px solid var(--ink); }
  .leaflet-tooltip.resident-label { font-weight: 700; }

  /* ---- 下: 選択した要支援者の判定結果と避難所候補 ---- */
  #detail { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-top: 1px solid var(--ink); }
  .detail-head { display: flex; align-items: flex-start; gap: 12px; flex: none; padding: 6px 16px 4px; }
  #selected-summary { flex: 1; min-width: 0; }
  #selected-summary .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 12px; }
  #selected-summary .title { font-size: 18px; font-weight: 700; line-height: 1.4; }
  #selected-summary .tag { align-self: center; }
  #selected-summary .status-warn { font-size: 14px; }
  #detail-toggle { flex: none; min-height: 32px; }
  #detail-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px 24px; padding: 0 16px 8px; min-height: 0; overflow-y: auto; }
  #detail.collapsed #detail-body { display: none; }
  #detail.collapsed .detail-head { padding-bottom: 8px; }
  #detail.no-selection #detail-body, #detail.no-selection #detail-toggle { display: none; }
  .detail-section h3 { font-size: 14px; line-height: 1.5; margin-bottom: 4px; }
  .detail-section h3 .sub { font-weight: 400; color: var(--ink-2); font-size: 13px; margin-left: 8px; }

  /* 本人住所のハザード判定。4つの状態を、文字・枠線の形・見出しの札で区別する（色だけで区別しない） */
  .hazard-box { padding: 8px 12px; border: 1px solid var(--control); background: var(--panel); }
  .hazard-box .state { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 600; }
  .hazard-box .reason { margin-top: 2px; font-size: 14px; color: var(--ink-2); }
  .hazard-box.hit { border: 1px solid var(--warn-line); border-left: 6px solid var(--warn-line); background: var(--warn-bg); }
  .hazard-box.none { border-left: 6px solid var(--control); }
  .hazard-box.unchecked { border: 1px dashed var(--control); background: var(--bg); }
  .hazard-box.unavailable { border: 2px dashed var(--warn-line); }
  .hazard-groups { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
  .hazard-groups li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 14px; }
  .hazard-groups .category { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  .hazard-detail { display: inline-block; padding: 0 6px; border: 1px solid var(--control); background: var(--panel); font-size: 13px; }

  /* 避難所候補（候補1〜3を、同じ列構成の表で比較する） */
  #candidates { overflow-x: auto; }
  table.cand { width: 100%; border-collapse: collapse; border: 1px solid var(--control); font-size: 16px; }
  table.cand caption { text-align: left; }
  table.cand th, table.cand td { padding: 2px 10px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
  table.cand thead th { background: #e0e0e0; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--control); }
  table.cand th.num, table.cand td.num { text-align: right; white-space: nowrap; width: 1%; font-variant-numeric: tabular-nums; }
  table.cand td.rank-cell { white-space: nowrap; width: 1%; padding: 0 6px; }
  table.cand td.name-cell { overflow-wrap: anywhere; min-width: 8em; }
  table.cand tbody tr { cursor: pointer; }
  table.cand tbody tr:hover { background: var(--hover); }
  table.cand tbody tr.active { background: var(--primary-bg); }
  table.cand tbody tr.active td.rank-cell { box-shadow: inset 4px 0 0 var(--primary); }
  table.cand tbody tr.active td.name-cell, table.cand tbody tr.active td.num { font-weight: 700; }
  .cand-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px; font-size: 14px; font-weight: 600;
    color: var(--ink); background: transparent; border: 0; border-radius: 0;
  }
  .cand-btn:hover:enabled { background: transparent; }
  .rank-chip {
    display: inline-block; width: 24px; height: 24px; line-height: 20px; text-align: center; border-radius: 50%;
    border: 2px solid #fff; color: #fff; background: var(--ink); font-weight: 700; font-size: 13px; box-shadow: 0 0 0 1px rgba(0,0,0,.5);
  }
  .active .rank-chip { border: 3px solid var(--focus); line-height: 18px; box-shadow: 0 0 0 2px var(--ink); }
  .empty-state { padding: 8px 12px; border: 1px dashed var(--control); background: var(--bg); font-size: 14px; }
  .cand-note { margin-top: 2px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }

  /* ---- 画面の広さに応じた配置 ---- */
  /* 画面の高さに収める。ただし、高さが足りない画面（ブラウザの上部が広い・拡大表示など）でも、地図を小さくしすぎない
     よう最低の高さを決め、足りない分は画面全体のスクロールで見る。 */
  @media (min-width: 900px) {
    #app { height: 100vh; height: 100dvh; min-height: 760px; }
    #main {
      min-height: 0;
      grid-template-columns: clamp(272px, 24vw, 380px) minmax(0, 1fr);
      grid-template-rows: auto minmax(370px, 1fr) auto;
      grid-template-areas: "list tools" "list map" "list detail";
    }
    #sidebar { overflow: hidden; border-bottom: 0; border-right: 1px solid var(--line); }
    #results-scroll { flex: 1; max-height: none; min-height: 120px; }
    #map { flex: 1; height: auto; min-height: 0; }
    #detail-body { grid-template-columns: minmax(0, 5fr) minmax(0, 8fr); align-items: start; }
  }
  /* さらに広い画面では、地図の表示設定を地図の右に置き、地図の高さを広げる */
  @media (min-width: 1280px) {
    #main {
      grid-template-columns: clamp(288px, 22vw, 380px) minmax(0, 1fr) clamp(224px, 16vw, 264px);
      grid-template-rows: minmax(370px, 1fr) auto;
      grid-template-areas: "list map tools" "list detail detail";
    }
    #map-tools {
      flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 12px; padding: 12px;
      overflow-y: auto; border-bottom: 0; border-left: 1px solid var(--line);
    }
    #map-tools > h2 { margin-bottom: -6px; }
    .tool-group { flex-direction: column; align-items: stretch; gap: 0; }
    #map-tools .check { min-height: 32px; }
    .layers { flex-direction: column; gap: 0; }
    #layers-title { margin-bottom: 2px; }
    .tool-group .btn-row { margin-top: 6px; }
    #layer-hint { flex-basis: auto; margin-top: 6px; }
    .tool-group .btn-row { flex-wrap: nowrap; gap: 6px; }
    .tool-group .btn-row button { padding: 0 8px; min-height: 34px; }
  }
  @media (max-width: 899px) {
    #summary { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title toggle" "body body"; }
    .summary-title { grid-area: title; }
    #summary-toggle { grid-area: toggle; }
    .summary-body { grid-area: body; }
    .summary-group + .summary-group { padding-left: 0; border-left: 0; }
    .summary-group { padding-right: 24px; }
    #page-header { padding: 8px 12px; }
    #summary, #detail-body, .detail-head { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="page-header">
    <h1>避難所候補レビュー（sheltermatch）<span class="generated" id="generated-at"></span></h1>
    <p class="notice">
      避難所候補は<strong>本人の地点からの直線距離による候補であり、最終的な割り当てではありません</strong>。
      地図の線は<strong>本人と避難所を結ぶ直線で、実際に通る経路ではありません</strong>
      （実際の経路は、本人への聞き取り等で職員が判断してください）。
    </p>
  </header>

  <section id="summary" aria-labelledby="summary-title">
    <div class="summary-title">
      <h2 id="summary-title">本人住所のハザード集計</h2>
      <details id="summary-help" hidden>
        <summary>集計の見方</summary>
        <p id="summary-help-text"></p>
      </details>
    </div>
    <div class="summary-body" id="summary-body">
      <div class="summary-rows" id="summary-rows"></div>
      <p class="note summary-note" id="summary-note"></p>
    </div>
    <button id="summary-toggle" type="button" aria-expanded="true" aria-controls="summary-body">集計をたたむ</button>
  </section>

  <main id="main">
    <section id="sidebar" aria-labelledby="sidebar-title">
      <h2 id="sidebar-title">要支援者</h2>
      <label class="field-label" for="search">resident_id または住所で検索</label>
      <input type="search" id="search" autocomplete="off">
      <!-- 既存データの事実だけによる絞り込み（複数選ぶと、検索とあわせてすべてに当てはまる人を表示） -->
      <div class="filters" id="filters" role="group" aria-label="一覧の絞り込み">
        <label class="check"><input type="checkbox" id="filter-coordinates"> <span>座標を確認</span></label>
        <label class="check" id="filter-hazard-label" hidden><input type="checkbox" id="filter-hazard"> <span>ハザード該当あり</span></label>
      </div>
      <div id="count" role="status" aria-live="polite"></div>
      <div id="results-scroll">
        <ul class="results" id="results" aria-label="要支援者の一覧"></ul>
      </div>
      <div id="more-note"></div>
      <div class="nav">
        <button id="prev" type="button">← 前へ</button>
        <button id="next" type="button">次へ →</button>
        <span id="position"></span>
      </div>
    </section>

    <section id="map-tools" aria-labelledby="map-tools-title">
      <h2 id="map-tools-title">地図の表示</h2>
      <div class="tool-group">
        <label class="check"><input type="checkbox" id="basemap-toggle" checked> <span>背景地図</span></label>
        <div class="note" id="basemap-note"></div>
      </div>
      <div class="tool-group" id="layer-section" role="group" aria-labelledby="layers-title">
        <span class="tool-title" id="layers-title">ハザード区域</span>
        <div class="layers" id="layers"></div>
        <div class="btn-row">
          <button id="layers-all" type="button">すべて表示</button>
          <button id="layers-none" type="button">すべて非表示</button>
        </div>
        <p class="note" id="layer-hint">要支援者を選ぶと、その人に関係する種別を自動で表示します。</p>
      </div>
    </section>

    <div id="map-area">
      <div id="map" aria-label="地図（本人地点と避難所候補1〜3）"></div>
      <div id="map-fallback"></div>
      <div id="map-meta">
        <span id="map-attribution"></span>
        <details id="bounds-details">
          <summary>表示範囲の経緯度</summary>
          <span id="view-bounds"></span>
        </details>
      </div>
    </div>

    <section id="detail" aria-label="選択した要支援者の判定結果と避難所候補">
      <div class="detail-head">
        <div id="selected-summary"></div>
        <button id="detail-toggle" type="button" aria-expanded="true" aria-controls="detail-body">候補詳細をたたむ</button>
      </div>
      <div id="detail-body">
        <section class="detail-section" aria-labelledby="hazard-title">
          <h3 id="hazard-title">本人住所のハザード判定</h3>
          <div id="hazard-result"></div>
        </section>
        <section class="detail-section" aria-labelledby="cand-title">
          <h3 id="cand-title">避難所候補<span class="sub">本人住所からの直線距離が短い順（候補1が最も短い）</span></h3>
          <div id="candidates"></div>
        </section>
      </div>
    </section>
  </main>
</div>

<script type="application/json" id="review-data">__REVIEW_DATA_JSON__</script>
<script src="assets/js/leaflet.js"></script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("review-data").textContent);
  var RESIDENTS = DATA.residents || [];
  var HAZARD_LAYERS = DATA.hazard_layers || [];
  var SUMMARY = DATA.summary || null;
  var BASEMAP = DATA.basemap;
  var BASEMAP_ATTRIBUTION = DATA.basemap_attribution;
  var RESULT_LIMIT = 50;
  var LINE_COLOR = "#161616";

  var map = null;
  var featureLayer = null;
  var graticuleLayer = null;
  var basemapLayer = null;
  var overlays = {};
  var filtered = [];
  var selectedIndex = -1;
  var activeRank = null;

  function el(id) { return document.getElementById(id); }

  function setText(node, value) { node.textContent = value == null ? "" : String(value); }

  function createElement(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text != null) { node.textContent = String(text); }
    return node;
  }

  // Leafletのツールチップは、文字列を渡すとHTMLとして解釈される。避難所名のような
  // 利用者データがHTMLとして扱われないよう、必ずDOM要素にして渡す。
  function textTooltip(text) {
    var node = document.createElement("span");
    node.textContent = text;
    return node;
  }

  // ---- 地図の初期化 ----
  // Leaflet本体・背景地図PNG・ハザードPNGはいずれもこの成果物へ同梱しているため、
  // 外部通信なしで地図・背景地図・ハザード区域を表示できる（閉域環境での利用を想定）。
  //
  // 表示順は「背景地図 → ハザードPNG → 直線 → 要支援者・候補避難所」で固定したいため、
  // レイヤーの追加・削除順に依存しないよう、専用のpane（重なり順を決める階層）を
  // 用意してzIndexで順序を固定する（basemapPane=200 < hazardPane=300
  // < 直線・線を置く既定のoverlayPane=400 < マーカーの既定のmarkerPane=600）。
  //
  // 拡大・縮小できる範囲を、市内の確認に必要な範囲に限る。制限しないと、ホイール操作を
  // 続けるだけで際限なく拡大・縮小でき、背景地図・マーカーが画面から消えて、どこを見ているのか
  // 分からなくなる（背景地図は最大でもズーム15相当の画像のため、18より先は拡大しても細部は増えない）。
  var MIN_ZOOM = 10;
  var MAX_ZOOM = 18;

  function initMap() {
    if (typeof L === "undefined") {
      el("map").style.display = "none";
      var fallback = el("map-fallback");
      fallback.style.display = "block";
      setText(fallback,
        "地図ライブラリ（Leaflet）を読み込めませんでした。review.html と同じ場所の " +
        "assets フォルダごと展開されているか確認してください。" +
        "検索・候補一覧はこのまま利用できます。");
      return;
    }
    // 起動直後は、背景地図の範囲（要支援者・避難所の全体）を表示する。座標の無い要支援者を選んでいても、
    // 対象の自治体が映るようにするため（特定の市の位置を決め打ちしない）。
    map = L.map("map", { minZoom: MIN_ZOOM, maxZoom: MAX_ZOOM }).fitBounds(BASEMAP.bounds);
    map.createPane("basemapPane").style.zIndex = 200;
    map.createPane("hazardPane").style.zIndex = 300;
    featureLayer = L.layerGroup().addTo(map);
    graticuleLayer = L.layerGroup().addTo(map);
    initBasemap();
    buildOverlays();
    map.on("moveend", drawGraticule);
    drawGraticule();
    renderAttribution();
    watchMapSize();
  }

  // 画面の広さ・集計や候補詳細の開閉で地図の大きさが変わったとき、Leafletへ現在の大きさを取り直させる
  // （取り直さないと、地図が一部しか描かれない・位置がずれる）
  function watchMapSize() {
    if (typeof ResizeObserver === "undefined") { return; }
    var pending = false;
    new ResizeObserver(function () {
      if (pending) { return; }
      pending = true;
      window.requestAnimationFrame(function () {
        pending = false;
        if (map) { map.invalidateSize({ animate: false }); }
      });
    }).observe(el("map"));
  }

  // ---- 背景地図（同梱のオフラインPNG。既定でON、外部通信なし） ----
  function initBasemap() {
    basemapLayer = L.imageOverlay(BASEMAP.image, BASEMAP.bounds, { pane: "basemapPane" });
    basemapLayer.once("add", function () {
      basemapLayer.getElement().addEventListener("error", function () {
        var note = el("basemap-note");
        note.className = "note warn";
        setText(note,
          "背景地図画像を読み込めませんでした。review.html と同じ場所に " +
          "assets フォルダごと展開されているか確認してください。");
      });
    });
    setBasemapEnabled(el("basemap-toggle").checked);
  }

  function setBasemapEnabled(enabled) {
    if (!map || !basemapLayer) { return; }
    if (enabled) {
      if (!map.hasLayer(basemapLayer)) { basemapLayer.addTo(map); }
    } else if (map.hasLayer(basemapLayer)) {
      map.removeLayer(basemapLayer);
    }
  }

  // ---- 出典表示（国土地理院。地理院タイルを画像化して同梱しているための表記） ----
  function renderAttribution() {
    setText(el("map-attribution"),
      "背景地図: " + BASEMAP_ATTRIBUTION + "（地理院タイルをオフライン用に画像化して同梱）");
  }

  // ---- 経緯度グリッド（位置の目安。背景地図に重ねて表示する） ----
  var GRATICULE_STEPS = [1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01, 0.005, 0.002, 0.001];

  function graticuleStep(span) {
    for (var i = 0; i < GRATICULE_STEPS.length; i += 1) {
      if (span / GRATICULE_STEPS[i] >= 4) { return GRATICULE_STEPS[i]; }
    }
    return GRATICULE_STEPS[GRATICULE_STEPS.length - 1];
  }

  function drawGraticule() {
    if (!map || !graticuleLayer) { return; }
    graticuleLayer.clearLayers();
    var bounds = map.getBounds();
    var south = bounds.getSouth(), north = bounds.getNorth();
    var west = bounds.getWest(), east = bounds.getEast();
    var step = graticuleStep(Math.max(north - south, east - west));
    // 候補の直線と見分けられるよう、グリッド線には専用のクラス名を付ける
    var style = {
      className: "graticule-line",
      color: "#9aa5b1", weight: 1, opacity: 0.5, interactive: false
    };

    for (var lat = Math.ceil(south / step) * step; lat <= north; lat += step) {
      L.polyline([[lat, west], [lat, east]], style).addTo(graticuleLayer);
    }
    for (var lon = Math.ceil(west / step) * step; lon <= east; lon += step) {
      L.polyline([[south, lon], [north, lon]], style).addTo(graticuleLayer);
    }

    setText(el("view-bounds"),
      "表示範囲 緯度 " + south.toFixed(4) + "〜" + north.toFixed(4)
      + " / 経度 " + west.toFixed(4) + "〜" + east.toFixed(4)
      + "（グリッド間隔 " + step + "度）");
  }

  function buildOverlays() {
    HAZARD_LAYERS.forEach(function (layer) {
      overlays[layer.key] = L.imageOverlay(layer.image, layer.bounds, {
        opacity: 0.45, pane: "hazardPane"
      });
    });
  }

  // ---- ハザードレイヤ操作 ----
  function renderLayerControls() {
    var container = el("layers");
    container.textContent = "";
    if (!HAZARD_LAYERS.length) {
      el("layer-section").style.display = "none";
      return;
    }
    HAZARD_LAYERS.forEach(function (layer) {
      var label = createElement("label", "check");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.dataset.key = layer.key;
      input.addEventListener("change", function () {
        setLayerEnabled(layer.key, input.checked);
      });
      var swatch = createElement("span", "swatch");
      swatch.style.background = layer.color;
      swatch.setAttribute("aria-hidden", "true");
      label.appendChild(input);
      label.appendChild(swatch);
      label.appendChild(createElement("span", "", layer.label));
      container.appendChild(label);
    });
  }

  function setLayerEnabled(key, enabled) {
    var checkbox = document.querySelector('#layers input[data-key="' + key + '"]');
    if (checkbox) { checkbox.checked = enabled; }
    var overlay = overlays[key];
    if (!map || !overlay) { return; }
    if (enabled) {
      if (!map.hasLayer(overlay)) { overlay.addTo(map); }
    } else if (map.hasLayer(overlay)) {
      map.removeLayer(overlay);
    }
  }

  function setAllLayers(enabled) {
    HAZARD_LAYERS.forEach(function (layer) { setLayerEnabled(layer.key, enabled); });
  }

  function applyRelevantLayers(resident) {
    var relevant = {};
    (resident.hazards || []).forEach(function (hazard) { relevant[hazard.key] = true; });
    HAZARD_LAYERS.forEach(function (layer) {
      setLayerEnabled(layer.key, Boolean(relevant[layer.key]));
    });
  }

  // ---- 検索・一覧 ----
  function normalize(value) { return (value == null ? "" : String(value)).toLowerCase(); }

  // ---- 一覧の絞り込み（既存データの事実だけを使う。独自の評価・優先度は付けない） ----
  // 座標を確認        : match_status が ok 以外（no_coordinates・invalid_coordinates・想定外の値）
  // ハザード該当あり  : 本人の地点が、いずれかのハザード区域に該当する（ハザード判定を実施した場合だけ表示）
  // 複数選んだ場合と文字検索は、すべてに当てはまる人（AND）を表示する。
  var FILTERS = [
    { id: "filter-coordinates", available: function () { return true; },
      test: function (resident) { return resident.match_status !== "ok"; } },
    { id: "filter-hazard", label: "filter-hazard-label",
      available: function () { return Boolean(DATA.hazard_checked); },
      test: function (resident) { return resident.resident_in_hazard === true; } }
  ];

  // 使える絞り込みだけを表示し、それぞれに当てはまる人数を添える（何件あるかが事前に分かるように）
  function initFilters() {
    FILTERS.forEach(function (filter) {
      var input = el(filter.id);
      if (!filter.available()) {
        input.checked = false;
        return;
      }
      if (filter.label) { el(filter.label).hidden = false; }
      var total = 0;
      RESIDENTS.forEach(function (resident) { if (filter.test(resident)) { total += 1; } });
      input.parentNode.appendChild(createElement("span", "filter-count", "(" + total + ")"));
      input.addEventListener("change", applyFilter);
    });
  }

  function activeFilters() {
    return FILTERS.filter(function (filter) { return filter.available() && el(filter.id).checked; });
  }

  function applyFilter() {
    var query = normalize(el("search").value).trim();
    var filters = activeFilters();
    filtered = [];
    for (var i = 0; i < RESIDENTS.length; i += 1) {
      var resident = RESIDENTS[i];
      var matchesQuery = !query
        || normalize(resident.resident_id).indexOf(query) >= 0
        || normalize(resident.address).indexOf(query) >= 0;
      if (matchesQuery && filters.every(function (filter) { return filter.test(resident); })) {
        filtered.push(i);
      }
    }
    if (filtered.indexOf(selectedIndex) < 0) {
      select(filtered.length ? filtered[0] : -1);
    } else {
      renderResults();
      updatePosition();
    }
  }

  // 一覧は一度にRESULT_LIMIT件までしか描かない（何千件でも検索のたびに重くならないようにするため）。
  // 描く範囲は選択中の要支援者を含むページにする。ここを常に先頭からにすると、「次へ」で
  // RESULT_LIMIT件目より後ろへ進んだときに、選択中の行が一覧から消えてしまう。
  function visibleRange() {
    var position = filtered.indexOf(selectedIndex);
    var start = position < 0 ? 0 : Math.floor(position / RESULT_LIMIT) * RESULT_LIMIT;
    return { start: start, end: Math.min(start + RESULT_LIMIT, filtered.length) };
  }

  function renderResults() {
    var list = el("results");
    list.textContent = "";
    var range = visibleRange();
    for (var i = range.start; i < range.end; i += 1) {
      list.appendChild(createResultItem(filtered[i]));
    }
    if (!filtered.length) {
      list.appendChild(createElement("li", "list-empty", RESIDENTS.length
        ? "検索・絞り込みの条件に該当する要支援者はいません。条件を変えるか、解除してください。"
        : "要支援者のデータがありません。"));
    }
    setText(el("count"), "該当 " + filtered.length + "件 / 全 " + RESIDENTS.length + "件");
    setText(el("more-note"),
      filtered.length > RESULT_LIMIT
        ? "該当" + filtered.length + "件のうち " + (range.start + 1) + "〜" + range.end
          + "件目を表示しています（検索・絞り込みで対象を減らせます）。"
        : "");
    // 選択中の行が見えるように、一覧の内側だけをスクロールする（画面全体は動かさない）
    var selected = list.querySelector('button[aria-current="true"]');
    if (selected) {
      var scroller = el("results-scroll");
      var row = selected.parentNode;
      if (row.offsetTop < scroller.scrollTop) {
        scroller.scrollTop = row.offsetTop;
      } else if (row.offsetTop + row.offsetHeight > scroller.scrollTop + scroller.clientHeight) {
        scroller.scrollTop = row.offsetTop + row.offsetHeight - scroller.clientHeight;
      }
    }
  }

  // ---- 位置情報の状態（match_status）の表示 ----
  // 内部の状態名（ok / no_coordinates / invalid_coordinates）は職員向けの言葉に置き換える。
  // ok は表示しない。想定外の値は正常扱いにせず、確認が必要であることを示す。
  function coordinateStatus(resident) {
    var status = resident.match_status;
    if (status === "ok") { return null; }
    if (status === "no_coordinates") {
      return { badge: "座標なし", text: "座標がありません。元データの住所・緯度経度を確認してください。" };
    }
    if (status === "invalid_coordinates") {
      return { badge: "座標を確認",
               text: "座標を確認してください（緯度・経度が数値として読めないか、範囲外です）。" };
    }
    return { badge: "要確認", text: "位置情報の状態を確認してください（状態: " + status + "）。" };
  }

  // 一覧の1人分。Tab・Enterで操作できるよう、行全体を1つのボタンにする。
  // Tabで入れるのは選択中の1行だけにし（何十件もTabで通過しなくて済むように）、行どうしは↑↓キーで移動する。
  function createResultItem(index) {
    var resident = RESIDENTS[index];
    var current = index === selectedIndex;
    var item = createElement("li");
    var button = createElement("button", "resident-item");
    button.type = "button";
    button.dataset.index = String(index);
    button.setAttribute("aria-current", current ? "true" : "false");
    button.tabIndex = current ? 0 : -1;
    var rid = createElement("div", "rid", resident.resident_id);
    var listStatus = coordinateStatus(resident);
    if (listStatus || !resident.has_coordinates) {
      rid.appendChild(createElement("span", "tag warn", listStatus ? listStatus.badge : "座標なし"));
    }
    if (DATA.hazard_checked && resident.resident_in_hazard === true) {
      rid.appendChild(createElement("span", "tag", "ハザード該当"));
    }
    button.appendChild(rid);
    button.appendChild(createElement("div", "addr", resident.address));
    button.addEventListener("click", function () {
      select(index);
      focusSelectedItem();
    });
    item.appendChild(button);
    return item;
  }

  function focusSelectedItem() {
    var button = el("results").querySelector('button[aria-current="true"]');
    if (button) { button.focus({ preventScroll: true }); }
  }

  function updatePosition() {
    var position = filtered.indexOf(selectedIndex);
    setText(el("position"), position >= 0 ? (position + 1) + " / " + filtered.length : "");
    el("prev").disabled = position <= 0;
    el("next").disabled = position < 0 || position >= filtered.length - 1;
  }

  function step(offset) {
    var position = filtered.indexOf(selectedIndex);
    if (position < 0) { return; }
    var next = position + offset;
    if (next < 0 || next >= filtered.length) { return; }
    select(filtered[next]);
  }

  // 「前へ」「次へ」を押して端に着いたら、押したボタンが使えなくなる。キーボードの操作が止まらないよう、
  // フォーカスを反対側のボタンへ移す。
  function stepFromButton(offset) {
    var pressed = el(offset < 0 ? "prev" : "next");
    step(offset);
    if (pressed.disabled && document.activeElement === pressed) {
      var other = el(offset < 0 ? "next" : "prev");
      if (!other.disabled) { other.focus(); }
    }
  }

  // 一覧の中で↑↓・Home・Endを押したときの移動（Tabでは選択中の1行にだけ入るため）
  function onResultsKeydown(event) {
    var delta = null;
    if (event.key === "ArrowDown") { delta = 1; }
    else if (event.key === "ArrowUp") { delta = -1; }
    else if (event.key !== "Home" && event.key !== "End") { return; }
    var position = filtered.indexOf(selectedIndex);
    if (position < 0) { return; }
    var next = event.key === "Home" ? 0
      : event.key === "End" ? filtered.length - 1
      : Math.max(0, Math.min(filtered.length - 1, position + delta));
    event.preventDefault();
    if (next !== position) {
      select(filtered[next]);
      focusSelectedItem();
    }
  }

  // ---- 選択 ----
  function select(index) {
    selectedIndex = index;
    activeRank = null;
    renderResults();
    updatePosition();
    renderSelected();
  }

  function renderSelected() {
    var summary = el("selected-summary");
    summary.textContent = "";
    el("candidates").textContent = "";
    el("hazard-result").textContent = "";
    if (featureLayer) { featureLayer.clearLayers(); }

    updateOverviewButton(null);
    el("detail").classList.toggle("no-selection", selectedIndex < 0);
    if (selectedIndex < 0) {
      // 該当する要支援者がいない（検索・絞り込みで0件）場合は、直前の要支援者に合わせた表示を残さない。
      // 要支援者・候補・直線（上で消去済み）に加えて、ハザード区域の表示（チェックも）を外し、
      // 地図を全体が見える位置へ戻す。再び誰かを選べば、その人に必要なハザード区域の表示に戻る。
      lastViewPoints = null;
      setAllLayers(false);
      resetMapView();
      summary.appendChild(createElement("div", "title", RESIDENTS.length && !filtered.length
        ? "検索・絞り込みの条件に該当する要支援者はいません。"
        : "要支援者を選択してください。"));
      return;
    }

    var resident = RESIDENTS[selectedIndex];
    applyRelevantLayers(resident);
    updateOverviewButton(resident);

    var who = createElement("div", "who");
    who.appendChild(createElement("span", "title", resident.resident_id));
    who.appendChild(createElement("span", "addr", resident.address));
    var coordinate = coordinateStatus(resident);
    if (coordinate || !resident.has_coordinates) {
      who.appendChild(createElement("span", "tag warn", coordinate ? coordinate.badge : "座標なし"));
    }
    summary.appendChild(who);

    // 座標が使えない場合は、状態と「候補が算出されていない」ことをこの欄にまとめる
    // （ハザード判定・候補の欄では、それぞれ判定・算出できない旨だけを示す）
    if (coordinate || !resident.has_coordinates) {
      summary.appendChild(createElement("div", "status-warn", (coordinate ? coordinate.text : "")
        + (resident.has_coordinates ? "" : "地図に表示できる座標が無いため、避難所候補は算出されていません。")));
    }

    renderHazardResult(resident);
    renderCandidateTable(resident);
    drawResident(resident);
  }

  // ---- 本人住所のハザード判定 ----
  // 判定の対象は要支援者本人の地点だけ。次の4つの状態を、文字・枠線の形・札の表示で区別する。
  //   該当         : 本人の地点が、ハザード区域に該当する
  //   該当なし     : 判定した結果、どの区域にも該当しない
  //   未判定       : ハザード判定を実施していない
  //   判定不可     : ハザード判定は実施したが、この人は座標が使えず判定できない
  // 大分類（津波・高潮・洪水・土砂災害など）ごとに、公式データの詳細区分（浸水深の区分・計画規模／想定最大規模・
  // 現象の種類など）を、言い換えずにそのまま並べる。「該当なし」と「未判定」「判定不可」は同じ表示にしない。
  function hazardBox(kind, label, tagClass, reason) {
    var box = createElement("div", "hazard-box " + kind);
    var state = createElement("div", "state");
    state.appendChild(createElement("span", "tag " + tagClass, label.tag));
    state.appendChild(createElement("span", "", label.text));
    box.appendChild(state);
    if (reason) { box.appendChild(createElement("div", "reason", reason)); }
    return box;
  }

  function renderHazardResult(resident) {
    var container = el("hazard-result");
    if (!DATA.hazard_checked) {
      container.appendChild(hazardBox("unchecked", { tag: "未判定", text: "判定を実施していません" }, "",
        "ハザード判定を実施していないため、「該当なし」ではありません。"));
      return;
    }
    if (!resident.has_coordinates || resident.hazards === null || resident.hazards === undefined) {
      container.appendChild(hazardBox("unavailable", { tag: "判定不可", text: "判定できません" }, "warn",
        resident.has_coordinates ? "この人の判定結果がデータにありません。"
                                 : "座標を取得できていないため、判定していません（「該当なし」ではありません）。"));
      return;
    }
    if (!resident.hazards.length) {
      container.appendChild(hazardBox("none", { tag: "該当なし", text: "判定した結果、該当なし" }, "", null));
      return;
    }
    var box = hazardBox("hit", { tag: "該当", text: "ハザード区域に該当" }, "hit", null);
    var list = createElement("ul", "hazard-groups");
    resident.hazards.forEach(function (hazard) {
      var item = createElement("li");
      var category = createElement("span", "category");
      var swatch = createElement("span", "swatch");
      swatch.style.background = layerColor(hazard.key) || "#6f6f6f";
      swatch.setAttribute("aria-hidden", "true");
      category.appendChild(swatch);
      category.appendChild(document.createTextNode(hazard.category));
      item.appendChild(category);
      hazard.details.forEach(function (detail) { item.appendChild(createElement("span", "hazard-detail", detail)); });
      list.appendChild(item);
    });
    box.appendChild(list);
    container.appendChild(box);
  }

  // ---- 候補の選択（マウスのクリックとキーボードの Enter / Space で共通の処理） ----
  // 選択した候補の直線と避難所名を強調する。選択中の行をもう一度押すと選択を外す。
  // 候補表は描き直すため、操作した行にフォーカスがあった場合は、描き直した同じ候補の行へ戻す。
  function selectCandidate(resident, rank) {
    var focused = document.activeElement;
    var keepFocus = focused && focused.closest && focused.closest("#candidates") !== null;
    activeRank = activeRank === rank ? null : rank;
    el("candidates").textContent = "";
    renderCandidateTable(resident);
    drawResident(resident);
    if (keepFocus) {
      var button = document.querySelector('#candidates button[data-rank="' + rank + '"]');
      if (button) { button.focus({ preventScroll: true }); }
    }
  }

  // ---- 距離欄 ----
  // 表示の単位だけを読みやすくする（1000m以上は km）。データの値は変えない。
  function formatDistance(meters) {
    if (meters == null) { return ""; }
    return meters >= 1000 ? (meters / 1000).toFixed(2) + " km" : Math.round(meters) + " m";
  }

  function renderCandidateTable(resident) {
    var container = el("candidates");
    if (!resident.candidates.length) {
      container.appendChild(createElement("div", "empty-state", resident.has_coordinates
        ? "避難所候補はありません。"
        : "座標が使えないため、避難所候補は算出されていません。"));
      return;
    }

    // 候補1〜3は、同じ列（順位・避難所名・直線距離）の表で比べる。
    // 行の操作は、順位のボタン（Tab・Enter・Spaceで選べる）か、行のどこかをクリックする。
    var table = createElement("table", "cand");
    table.appendChild(createElement("caption", "sr-only", "避難所候補（本人住所からの直線距離が短い順）"));
    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    [["順位", ""], ["避難所名", ""], ["直線距離", "num"]].forEach(function (column) {
      var th = createElement("th", column[1], column[0]);
      th.scope = "col";
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    resident.candidates.forEach(function (candidate) {
      var selected = activeRank === candidate.rank;
      var row = document.createElement("tr");
      row.className = selected ? "active" : "";

      var rankCell = createElement("td", "rank-cell");
      var button = createElement("button", "cand-btn");
      button.type = "button";
      button.dataset.rank = String(candidate.rank);
      button.setAttribute("aria-pressed", String(selected));
      button.setAttribute("aria-label", "候補" + candidate.rank + " " + candidate.name);
      button.appendChild(createElement("span", "rank-chip", candidate.rank));
      button.appendChild(createElement("span", "", "候補" + candidate.rank));
      if (selected) { button.appendChild(createElement("span", "tag selected", "選択中")); }
      rankCell.appendChild(button);
      row.appendChild(rankCell);

      row.appendChild(createElement("td", "name-cell", candidate.name));
      row.appendChild(createElement("td", "num", formatDistance(candidate.distance_m)));

      row.addEventListener("click", function () { selectCandidate(resident, candidate.rank); });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    container.appendChild(table);

    // 表の意味だけをここで説明する（直線であることの全体の注意は画面上部にまとめている）
    container.appendChild(createElement("p", "cand-note",
      "順位に、避難所の安全性やハザードは反映していません。行を押すと、地図でその候補を強調します（もう一度押すと解除）。"));
  }

  // ---- 地図描画（選択した1人だけ） ----
  // 本人の地点・候補避難所1〜3・本人と各候補を結ぶ直線を描く。表示範囲は、本人と候補がすべて入る範囲にする
  // （拡大しすぎないよう、ズーム17までにする）。
  var FOCUS_MAX_ZOOM = 17;
  var lastViewPoints = null;

  function drawResident(resident) {
    if (!map || !featureLayer) { return; }
    featureLayer.clearLayers();
    lastViewPoints = null;
    if (!resident.has_coordinates) { return; }

    var residentLatLng = [resident.latitude, resident.longitude];
    var allPoints = [residentLatLng];

    // 本人地点は、候補（番号つきの丸）と形が違うひし形にし、候補の下に置く（同じ位置でも両方が見えるように）
    L.marker(residentLatLng, {
      icon: L.divIcon({
        className: "resident-marker",
        html: '<div class="resident-pin"></div>',
        iconSize: [28, 28], iconAnchor: [14, 14]
      }),
      keyboard: false, zIndexOffset: -1000
    }).addTo(featureLayer).bindTooltip(textTooltip("本人地点"),
      { permanent: true, direction: "left", offset: [-12, 0], className: "resident-label" });

    resident.candidates.forEach(function (candidate) {
      var candidateLatLng = [candidate.latitude, candidate.longitude];
      allPoints.push(candidateLatLng);
      var emphasised = activeRank === candidate.rank;
      var dimmed = activeRank !== null && !emphasised;

      // 直線は、白い縁取りの上に重ねて、背景地図の上でも見えるようにする
      L.polyline([residentLatLng, candidateLatLng], {
        className: "straight-line-casing", color: "#ffffff", weight: emphasised ? 9 : 6,
        opacity: dimmed ? 0.3 : 0.85, interactive: false
      }).addTo(featureLayer);
      L.polyline([residentLatLng, candidateLatLng], {
        className: "straight-line",
        color: LINE_COLOR,
        weight: emphasised ? 5 : 3,
        opacity: dimmed ? 0.4 : 1,
        dashArray: "6 5"
      }).addTo(featureLayer).bindTooltip(
        textTooltip("候補" + candidate.rank + "への直線（実際に通る経路ではありません）"));

      // 選択中の候補は、マーカーを大きく・黄色の縁と黒い外枠付きにし、「候補N 避難所名」を常に表示する
      var size = emphasised ? 32 : 24;
      var marker = L.marker(candidateLatLng, {
        icon: L.divIcon({
          className: "",
          // ここで組み立てるのは候補番号（このNotebookが振る整数）だけで、利用者データは入れない
          html: '<div class="marker-pin' + (emphasised ? " selected" : "") + '">' + candidate.rank + '</div>',
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2]
        }),
        keyboard: false,
        opacity: dimmed ? 0.55 : 1,
        zIndexOffset: emphasised ? 1000 : 0
      }).addTo(featureLayer);
      marker.bindTooltip(textTooltip("候補" + candidate.rank + " " + candidate.name), emphasised
        ? { permanent: true, direction: "top", offset: [0, -18], className: "selected-candidate-label" }
        : {});
    });

    lastViewPoints = allPoints;
    fitView();
  }

  // 地図を全体が見える位置（背景地図の範囲＝要支援者・避難所の全体を覆う範囲）へ戻す。
  function resetMapView() {
    if (!map) { return; }
    map.invalidateSize({ animate: false });
    map.fitBounds(BASEMAP.bounds);
  }

  function fitView() {
    if (!map || !lastViewPoints) { return; }
    try {
      // 候補詳細の高さ（折りたたみ）で地図の大きさが変わるため、
      // 収める範囲を計算する前にLeafletへ現在の大きさを取り直させる
      map.invalidateSize({ animate: false });
      map.fitBounds(L.latLngBounds(lastViewPoints).pad(0.25), { maxZoom: FOCUS_MAX_ZOOM });
    } catch (error) {
      map.setView(lastViewPoints[0], 15);
    }
  }

  // ---- 全候補を表示 ----
  // 本人の地点と候補1〜3の避難所が入る範囲へ地図を戻す（拡大・移動したあとに全体へ戻す用）。
  // 候補の選択はそのまま。
  var overviewButton = null;

  function initOverviewControl() {
    if (!map) { return; }
    var OverviewControl = L.Control.extend({
      options: { position: "topleft" },
      onAdd: function () {
        var container = L.DomUtil.create("div", "leaflet-bar leaflet-control overview-control");
        overviewButton = L.DomUtil.create("button", "", container);
        overviewButton.type = "button";
        overviewButton.id = "show-all-candidates";
        setText(overviewButton, "全候補を表示");
        overviewButton.title = "本人の地点と候補避難所がすべて入る範囲を表示します";
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.on(overviewButton, "click", showAllCandidates);
        return container;
      }
    });
    new OverviewControl().addTo(map);
  }

  function updateOverviewButton(resident) {
    if (!overviewButton) { return; }
    overviewButton.disabled = !resident || !resident.has_coordinates || !resident.candidates.length;
  }

  function showAllCandidates() {
    if (selectedIndex < 0) { return; }
    var resident = RESIDENTS[selectedIndex];
    if (!resident.has_coordinates || !resident.candidates.length) { return; }
    lastViewPoints = [[resident.latitude, resident.longitude]].concat(
      resident.candidates.map(function (candidate) { return [candidate.latitude, candidate.longitude]; }));
    fitView();
  }

  // ---- 候補詳細の折りたたみ ----
  // ハザード判定・候補表をまとめて隠し、地図を広く使えるようにする（初期状態は表示）。
  // 要支援者の概要と開閉ボタンは、折りたたんでも残る。
  function setDetailCollapsed(collapsed) {
    el("detail").classList.toggle("collapsed", collapsed);
    var button = el("detail-toggle");
    setText(button, collapsed ? "候補詳細を表示" : "候補詳細をたたむ");
    button.setAttribute("aria-expanded", String(!collapsed));
    fitView();
  }

  // ---- ハザード別の人数集計（画面上部） ----
  // 集計は、判定時に付けたハザードの大分類（津波・高潮・洪水・土砂災害など）を使い、人 × 大分類で重複を除いて
  // 数えたもの（表示の文字列は解析しない）。同じ人が複数の大分類に該当する場合はそれぞれに1人ずつ計上するため、
  // 各大分類の人数を合計しても「いずれかに該当」とは一致しない場合がある。
  // 座標が使えず判定できなかった人は、「ハザード該当なし」には含めず、「座標未取得」として別に数える。
  function formatCount(value) {
    return value == null ? "" : Number(value).toLocaleString("ja-JP");
  }

  function summaryItem(label, value, color) {
    var item = createElement("div", "summary-item");
    var labelNode = createElement("span", "label");
    if (color) {
      var swatch = createElement("span", "swatch");
      swatch.style.background = color;
      swatch.setAttribute("aria-hidden", "true");
      labelNode.appendChild(swatch);
    }
    labelNode.appendChild(document.createTextNode(label));
    item.appendChild(labelNode);
    item.appendChild(createElement("span", "value", formatCount(value)));
    return item;
  }

  // 集計の1まとまり。見出し（title）の下に、項目を横に並べる
  function summaryGroup(title) {
    var group = createElement("div", "summary-group");
    group.appendChild(createElement("div", "summary-group-title", title));
    var items = createElement("div", "summary-items");
    group.appendChild(items);
    return { node: group, items: items };
  }

  function layerColor(key) {
    for (var i = 0; i < HAZARD_LAYERS.length; i += 1) {
      if (HAZARD_LAYERS[i].key === key) { return HAZARD_LAYERS[i].color; }
    }
    return null;
  }

  function renderSummary() {
    var rows = el("summary-rows");
    var note = el("summary-note");
    rows.textContent = "";
    if (!SUMMARY) { el("summary").hidden = true; return; }

    var counts = summaryGroup("件数");
    counts.items.appendChild(summaryItem("総件数", SUMMARY.total));
    counts.items.appendChild(summaryItem("座標あり", SUMMARY.with_coordinates));
    counts.items.appendChild(summaryItem("座標未取得", SUMMARY.without_coordinates));
    rows.appendChild(counts.node);

    if (!SUMMARY.hazard_checked) {
      setText(note, "ハザード判定を実施していないため、ハザードの集計はありません。");
      return;
    }

    var overall = summaryGroup("座標あり（ハザードを判定した人）");
    overall.items.appendChild(summaryItem("いずれかに該当", SUMMARY.any_hazard));
    overall.items.appendChild(summaryItem("ハザード該当なし", SUMMARY.no_hazard));
    rows.appendChild(overall.node);

    var byCategory = summaryGroup("ハザード大分類別（その大分類に該当する人数）");
    (SUMMARY.by_category || []).forEach(function (entry) {
      byCategory.items.appendChild(summaryItem(entry.category, entry.count, layerColor(entry.key)));
    });
    rows.appendChild(byCategory.node);

    // 集計の読み方の注意は、常時は表示せず、「集計の見方」を開くと読めるようにする
    setText(el("summary-help-text"),
      "同じ人が複数のハザードに該当する場合は、それぞれに1件ずつ計上しています。"
      + "このため、各大分類の人数を合計しても「いずれかに該当」とは一致しない場合があります。"
      + "座標未取得の人は、ハザードを判定できないため「ハザード該当なし」には含めていません。");
    el("summary-help").hidden = false;
  }

  // ---- 起動 ----
  setText(el("generated-at"), DATA.generated_at ? "作成: " + DATA.generated_at : "");
  initMap();
  initOverviewControl();
  renderSummary();
  initFilters();
  renderLayerControls();
  el("search").addEventListener("input", applyFilter);
  el("prev").addEventListener("click", function () { stepFromButton(-1); });
  el("next").addEventListener("click", function () { stepFromButton(1); });
  el("results").addEventListener("keydown", onResultsKeydown);
  el("basemap-toggle").addEventListener("change", function (event) {
    setBasemapEnabled(event.target.checked);
  });
  el("summary-toggle").addEventListener("click", function () {
    var collapsed = !el("summary").classList.contains("collapsed");
    el("summary").classList.toggle("collapsed", collapsed);
    setText(el("summary-toggle"), collapsed ? "集計を表示" : "集計をたたむ");
    el("summary-toggle").setAttribute("aria-expanded", String(!collapsed));
    if (map) { map.invalidateSize({ animate: false }); }
  });
  el("detail-toggle").addEventListener("click", function () {
    setDetailCollapsed(!el("detail").classList.contains("collapsed"));
  });
  el("layers-all").addEventListener("click", function () { setAllLayers(true); });
  el("layers-none").addEventListener("click", function () { setAllLayers(false); });
  applyFilter();
})();
</script>
</body>
</html>
